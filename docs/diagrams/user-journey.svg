<svg xmlns="http://www.w3.org/2000/svg" width="680" height="606" viewBox="0 0 680 606" role="img" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Syncy user journey: frontend and backend</title>
<desc>Six journey steps from event pick to dashboard; each frontend screen on the left is paired with the backend action it triggers on the right.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="606" fill="#ffffff"/>
<text x="170" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#3d3d3a">Frontend — what the user sees</text>
<text x="510" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#3d3d3a">Backend — what happens</text>

<rect x="40" y="60" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="170" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Pick event</text>
<text x="170" y="102" text-anchor="middle" font-size="12" fill="#534AB7">or create a new one</text>
<rect x="380" y="60" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="510" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">events table</text>
<text x="510" y="102" text-anchor="middle" font-size="12" fill="#0F6E56">select or insert row</text>
<line x1="300" y1="88" x2="376" y2="88" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="170" y1="116" x2="170" y2="146" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="150" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="170" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Scan QR code</text>
<text x="170" y="192" text-anchor="middle" font-size="12" fill="#534AB7">LinkedIn · Xing · other</text>
<rect x="380" y="150" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="510" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">contacts: insert</text>
<text x="510" y="192" text-anchor="middle" font-size="12" fill="#0F6E56">status captured · &lt; 3 s</text>
<line x1="300" y1="178" x2="376" y2="178" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="170" y1="206" x2="170" y2="236" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="240" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="170" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Add note</text>
<text x="170" y="282" text-anchor="middle" font-size="12" fill="#534AB7">type it, or voice memo</text>
<rect x="380" y="240" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="510" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">note_text / Storage</text>
<text x="510" y="282" text-anchor="middle" font-size="12" fill="#0F6E56">audio → Edge Function → transcript</text>
<line x1="300" y1="268" x2="376" y2="268" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="170" y1="296" x2="170" y2="326" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="330" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="170" y="353" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Processing</text>
<text x="170" y="372" text-anchor="middle" font-size="12" fill="#534AB7">progress, ≤ 15 s</text>
<rect x="380" y="330" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="510" y="353" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">AI processing endpoint</text>
<text x="510" y="372" text-anchor="middle" font-size="12" fill="#993C1D">STT → LLM ×2 → write back</text>
<line x1="300" y1="358" x2="376" y2="358" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="170" y1="386" x2="170" y2="416" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="420" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="170" y="443" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Review &amp; save</text>
<text x="170" y="462" text-anchor="middle" font-size="12" fill="#534AB7">edit fields · pick project</text>
<rect x="380" y="420" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="510" y="443" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">contacts: update</text>
<text x="510" y="462" text-anchor="middle" font-size="12" fill="#0F6E56">status review → saved</text>
<line x1="300" y1="448" x2="376" y2="448" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="170" y1="476" x2="170" y2="506" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="510" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="170" y="533" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Dashboard</text>
<text x="170" y="552" text-anchor="middle" font-size="12" fill="#534AB7">filter · stage · notes</text>
<rect x="380" y="510" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="510" y="533" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Postgres under RLS</text>
<text x="510" y="552" text-anchor="middle" font-size="12" fill="#0F6E56">select and update rows</text>
<line x1="300" y1="538" x2="376" y2="538" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
