<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Syncy Phase 2 architecture (Notion and notes-app sync)</title>
<desc>Supabase remains the source of truth; a pull function imports projects from Notion and a push function mirrors saved contacts out to Notion and other notes apps.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="430" fill="#ffffff"/>
<rect x="40" y="190" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="120" y="213" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Syncy apps</text>
<text x="120" y="232" text-anchor="middle" font-size="12" fill="#534AB7">phone + dashboard</text>
<rect x="240" y="60" width="220" height="330" rx="20" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
<text x="350" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#27500A">Supabase</text>
<text x="350" y="106" text-anchor="middle" font-size="12" fill="#3B6D11">source of truth</text>
<rect x="260" y="130" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="350" y="153" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Postgres</text>
<text x="350" y="172" text-anchor="middle" font-size="12" fill="#0F6E56">external sync keys</text>
<rect x="260" y="220" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="350" y="243" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Pull projects</text>
<text x="350" y="262" text-anchor="middle" font-size="12" fill="#0F6E56">from Notion · polling</text>
<rect x="260" y="310" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="350" y="333" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Push contacts</text>
<text x="350" y="352" text-anchor="middle" font-size="12" fill="#0F6E56">to Notion on save</text>
<rect x="500" y="100" width="140" height="290" rx="12" fill="none" stroke="#73726c" stroke-width="0.75" stroke-dasharray="6 4"/>
<text x="570" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#3d3d3a">Notes apps</text>
<rect x="512" y="150" width="116" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="570" y="179" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Notion</text>
<rect x="512" y="225" width="116" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="570" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Google Docs</text>
<rect x="512" y="282" width="116" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="570" y="307" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Obsidian +</text>
<line x1="200" y1="218" x2="236" y2="218" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="248" x2="444" y2="248" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440" y1="338" x2="496" y2="338" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
