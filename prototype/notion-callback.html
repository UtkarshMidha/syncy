<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe8">
  <title>Connecting Notion · Syncy</title>
  <style>
    :root { --bg: #f3efe8; --paper: #fffcf7; --ink: #30281f; --muted: #71685c; --line: #e5dccf; --accent: #8f472d; --accent-2: #c39858; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    main { box-sizing: border-box; width: min(420px, 100%); padding: 28px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: 0 5px 16px rgba(48, 40, 31, .045); overflow-wrap: anywhere; }
    h1 { margin-top: 0; font-size: 22px; } p { color: var(--muted); } a { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 0; color: var(--accent); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Connecting your Notion workspace…</h1>
    <p id="message" role="status" aria-live="polite">Syncy is securely completing the connection.</p>
    <a id="back" href="index.html?tab=projects" hidden>Return to Syncy Projects</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const message = document.getElementById('message');
    const back = document.getElementById('back');
    const fail = text => {
      document.getElementById('title').textContent = 'Could not connect Notion';
      message.textContent = text;
      back.hidden = false;
    };
    (async () => {
      if (params.has('error')) throw new Error(params.get('error_description') || 'Notion authorization was cancelled.');
      const code = params.get('code'), state = params.get('state');
      if (!code || !state) throw new Error('Notion did not return an authorization code. Start the connection again from Projects.');
      if (!await db.init()) throw new Error('Your Syncy session expired. Sign in and connect Notion again.');
      await db.notion('exchange', { code, state });
      location.replace('index.html?tab=projects&notion=connected');
    })().catch(error => fail(error.message || 'Notion connection failed.'));
  </script>
</body>
</html>
