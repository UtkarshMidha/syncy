<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<link rel="stylesheet" href="theme.css">
<title>Syncy</title>
<!--
  Phase 1 phone flow: choose / create event → scan → note → AI processing → review and save.
  The app requires an authenticated Supabase session; it does not run in demo mode.
-->
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--font-sans);
  display: grid; grid-template-columns: 248px minmax(0, 1fr); align-items: stretch;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
a { touch-action: manipulation; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 2px; }
.screen.dark :focus-visible { outline-color: var(--accent-2); }

/* ---------- workspace shell ---------- */
.side { width: 248px; height: 100dvh; position: sticky; top: 0; display: flex; flex-direction: column; padding: 26px 16px 18px; overflow-y: auto; background: var(--sidebar); color: #fff; }
.side .brand { margin: 0 10px; color: #fff; text-decoration: none; }
.side .logo { width: 30px; height: 30px; }
.side-tagline { margin: 9px 10px 30px; max-width: 205px; color: #adb7c4; font-size: 12.5px; line-height: 1.45; }
.side-spacer { flex: 1; min-height: 18px; }
.tabbar { display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 0; border: 0; background: transparent; }
.tabbar button, .tabbar a { width: 100%; min-height: 46px; display: flex; align-items: center; justify-content: flex-start; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--sidebar-muted); font-size: 13.5px; text-align: left; text-decoration: none; }
.tabbar button.on, .tabbar a[aria-current="page"] { background: rgba(255, 255, 255, .1); color: #fff; font-weight: 600; }
.tabbar svg { width: 19px; height: 19px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar .on svg { color: var(--accent-2); }
@media (hover: hover) and (pointer: fine) {
  .side .tabbar button:hover:not(.on), .side .tabbar a:hover:not([aria-current="page"]) { background: var(--sidebar-hover); color: #fff; }
}
.workflow-guide { margin: 18px 4px 14px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.1); }
.workflow-guide summary { min-height: 40px; display: flex; align-items: center; color: #d8dee7; font-size: 12.5px; font-weight: 600; cursor: pointer; list-style: none; }
.workflow-guide summary::-webkit-details-marker { display: none; }
.workflow-guide summary::after { content: '⌄'; margin-left: auto; color: #9da9b8; transition: transform .18s var(--ease-out); }
.workflow-guide[open] summary::after { transform: rotate(180deg); }
.workflow-guide ol { margin: 4px 0 10px; padding: 0; list-style: none; counter-reset: workflow; }
.workflow-guide li { counter-increment: workflow; display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; color: #aeb8c5; font-size: 11.5px; line-height: 1.4; }
.workflow-guide li::before { content: counter(workflow); width: 18px; height: 18px; flex: none; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.08); color: #c2cad4; font-size: 10px; font-weight: 700; }
.workflow-guide li.on { color: #fff; }
.workflow-guide li.on::before { background: var(--accent-cta); color: #fff; }
.workspace-account { margin: 0 4px; padding: 14px 8px 0; border-top: 1px solid rgba(255,255,255,.1); }
.account-label { display: flex; align-items: center; gap: 8px; color: #d8dee7; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.workspace-account p { margin: 5px 0 0; overflow-wrap: anywhere; color: #aeb8c5; font-size: 11.5px; line-height: 1.45; }
.workspace-account .account-note { color: #8f9baa; }
.workspace { width: 100%; min-width: 0; height: 100dvh; overflow: hidden; position: relative; display: flex; flex-direction: column; background: var(--bg); }
.screen { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 34px clamp(28px, 4vw, 64px); scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.screen > * { max-width: 1180px; margin-left: auto; margin-right: auto; }
.screen-loading { min-height: 100%; display: grid; place-content: center; justify-items: center; gap: 12px; color: var(--muted); text-align: center; }
.screen-loading .spinner { width: 36px; height: 36px; border-width: 3px; }
.screen::-webkit-scrollbar { display: none; }
.screen.dark { background: var(--surface-dark); color: #fff; }
.screen.flow { padding-bottom: 28px; }
.top > .brand { display: none; }

@media (max-width: 1100px) {
  .side { width: 220px; padding-right: 12px; padding-left: 12px; }
  body { grid-template-columns: 220px minmax(0, 1fr); }
  .side .brand { margin-left: 8px; }
  .screen { padding-right: 28px; padding-left: 28px; }
}
@media (max-width: 900px) {
  body { display: block; }
  .side { position: fixed; inset: auto 0 0; z-index: 30; width: 100%; height: auto; min-height: 0; padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); overflow: visible; border-top: 1px solid var(--line); background: rgba(255,255,255,.96); color: var(--ink); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .side .brand, .side-tagline, .side-spacer, .workflow-guide, .workspace-account { display: none; }
  .side.flow-hidden { display: none; }
  .tabbar { flex-direction: row; align-items: stretch; justify-content: space-around; gap: 4px; }
  .tabbar button, .tabbar a { flex: 1; min-width: 0; min-height: 52px; flex-direction: column; justify-content: center; gap: 4px; padding: 4px 2px; border-radius: 9px; color: var(--muted); font-size: 11px; line-height: 1.1; text-align: center; }
  .tabbar button.on, .tabbar a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
  .tabbar .on svg { color: var(--accent-ink); }
  @media (hover: hover) and (pointer: fine) {
    .side .tabbar button:hover:not(.on), .side .tabbar a:hover:not([aria-current="page"]) { background: var(--grey-soft); color: var(--ink); }
  }
  .tabbar svg { width: 21px; height: 21px; }
  .workspace { height: 100dvh; min-height: 100dvh; }
  .screen { padding: max(22px, calc(12px + env(safe-area-inset-top))) 20px 24px; scrollbar-width: none; }
  .screen:not(.flow) { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
  .top > .brand { display: flex; }
}
@media (max-width: 420px) {
  .screen { padding-right: 16px; padding-left: 16px; }
  .screen:not(.flow) { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- common ---------- */
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
.logo { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f1ba78, var(--accent-2) 46%, var(--accent) 100%); box-shadow: 0 3px 12px rgba(184, 74, 27, .18); }
.title { font-size: clamp(24px, 2.1vw, 30px); font-weight: 700; letter-spacing: -.035em; line-height: 1.2; margin: 4px 0 8px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 10px; font-weight: 600; background: var(--grey-soft); text-decoration: none; color: var(--ink); }
.btn svg, .pchip svg, .linkbtn svg, .seg svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn-primary { background: var(--accent-cta); color: #fff; box-shadow: 0 2px 6px rgba(23, 26, 33, .12); }
.btn-block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.btn-sm { min-height: 44px; padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--grey-soft); font-size: 16px; flex: none; }
.icon-btn svg { display: block; width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.dark .icon-btn { background: rgba(255, 255, 255, .12); color: #fff; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.grey { background: var(--grey-soft); color: var(--muted); }
.src { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; color: #fff; font-size: 11px; font-weight: 800; flex: none; }
a.src { text-decoration: none; }
.ptag { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 5px; color: #fff; font-size: 9px; font-weight: 800; letter-spacing: .02em; flex: none; }
.pthumb { width: 36px; height: 36px; border-radius: 10px; color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 800; flex: none; }
.spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.src.li { background: var(--linkedin); }
.src.xi { background: var(--xing); }
.src.ot { background: #667085; }
.avatar { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; }
.field { display: block; margin-top: 12px; }
.field > span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
textarea.edit, input.edit, select.edit { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; resize: vertical; }
textarea.edit:focus, input.edit:focus, select.edit:focus { outline: 2px solid var(--accent-ink); border-color: transparent; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; border: 1.5px dashed var(--line); border-radius: var(--radius); }

/* ---------- event picker ---------- */
.ev-option { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); transition: background-color .15s, border-color .15s; }
.ev-option .ev-select { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; padding: 0; text-align: left; }
.ev-del { flex: none; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); background: var(--grey-soft); font-size: 12px; }
@media (hover: hover) and (pointer: fine) { .ev-del:hover { color: var(--danger); background: var(--accent-soft); } }
.ev-option .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.ev-option.on { border-color: var(--accent); background: var(--accent-soft); }
.ev-option.on .radio { border-color: var(--accent); }
.ev-option.on .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.ev-option .meta { flex: 1; min-width: 0; }
.ev-option b { display: block; }
.ev-option .today { font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); padding: 2px 7px; border-radius: 999px; margin-left: 6px; }
.new-event { border: 1.5px dashed var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { min-height: 44px; font-size: 13px; font-weight: 600; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); text-align: left; transition: background-color .16s, border-color .16s, color .16s, transform .16s var(--ease-out), box-shadow .16s; }
.pchip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.ev-edit { display: block; min-height: 44px; padding: 8px 0; margin: -2px 0 10px 46px; font-size: 13px; font-weight: 600; color: var(--accent-ink); }
.ev-option .ev-link { display: block; font-size: 12px; color: var(--accent-ink); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-url { display: flex; gap: 10px; align-items: center; margin-top: 4px; font-size: 12.5px; }
.ev-url a { color: #ffd9a0; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-url a:hover { text-decoration: underline; }
.ev-url button { color: #e4e7ec; font-size: 12.5px; text-decoration: underline; }
.url-error { color: var(--danger); font-size: 12.5px; min-height: 0; margin-top: 4px; }
.stick-bottom { position: sticky; bottom: -24px; margin: 16px -18px -24px; padding: 12px 18px 18px; background: linear-gradient(180deg, rgba(255, 255, 255, 0), var(--phone) 30%); }

/* ---------- event home ---------- */
.event { display: flex; gap: 12px; align-items: center; background: var(--sidebar); color: #fff; border-radius: var(--radius); padding: 14px; }
.event .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok-on-dark); box-shadow: 0 0 0 4px rgba(115, 201, 145, .2); flex: none; }
.event small { color: #d0d5dd; }
.event .leave { margin-left: auto; font-size: 12.5px; font-weight: 600; color: #fff; background: rgba(255, 255, 255, .14); padding: 6px 10px; border-radius: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 22px; letter-spacing: -.02em; }
.stat span { font-size: 11.5px; color: var(--muted); line-height: 1.25; display: block; }
.scan-cta { margin-top: 14px; width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--radius-lg); color: #fff; text-align: left; background: var(--accent-cta); box-shadow: 0 4px 12px rgba(23, 26, 33, .12); }
.scan-cta svg { width: 40px; height: 40px; flex: none; }
.scan-cta b { font-size: 17px; display: block; }
.scan-cta small { opacity: .9; }
.person { display: flex; gap: 12px; align-items: flex-start; padding: 14px; margin-bottom: 8px; width: 100%; text-align: left; cursor: pointer; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); transition: transform .18s var(--ease-out), box-shadow .18s var(--ease-out), border-color .18s, background-color .18s; }
@media (hover: hover) and (pointer: fine) { .person:hover:not(.selected) { transform: translateY(-1px); border-color: var(--accent); box-shadow: 0 8px 22px rgba(23, 26, 33, .1); } }
.person:active { transform: scale(.995); }
.person .meta { flex: 1; min-width: 0; }
.person .name { font-weight: 650; display: flex; align-items: center; gap: 6px; }
.person .role { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person .next { font-size: 13px; margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- contacts: drag + multi-select ---------- */
.person[data-cid] { touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 99; margin: 0; opacity: .94; box-shadow: 0 14px 32px rgba(23, 26, 33, .2); pointer-events: none; }
.drag-src { opacity: .35; }
.dropzone { border-radius: 12px; margin-bottom: 12px; }
.dropzone.over { outline: 2px dashed var(--accent-ink); outline-offset: 3px; background: var(--accent-soft); }
.sel-dot { flex: none; width: 22px; height: 22px; margin-top: 6px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; color: #fff; background: #fff; }
.person.selected { outline: 2px solid var(--accent-ink); outline-offset: -2px; background: var(--accent-soft); }
.person.selected .sel-dot { background: var(--accent-cta); border-color: var(--accent-cta); }
.assignbar { position: sticky; bottom: 6px; z-index: 5; margin-top: 14px; padding: 12px; box-shadow: 0 -4px 18px rgba(23, 26, 33, .1), var(--shadow); }

/* ---------- scan ---------- */
.flowbar { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; margin-bottom: 16px; }
.flowbar .step { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--muted); }
.flowbar .flow-end { width: 44px; }
.flowbar .flow-actions { display: flex; align-items: center; gap: 6px; }
.dark .flowbar .step { color: #b3bac5; }
.viewfinder { position: relative; width: 230px; height: 230px; margin: 10px auto 14px; border-radius: 20px; background: radial-gradient(circle, var(--surface-raised), var(--surface-dark) 75%); display: grid; place-items: center; overflow: hidden; }
.viewfinder .corner { position: absolute; width: 38px; height: 38px; border: 4px solid #fff; }
.viewfinder .tl { top: 12px; left: 12px; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
.viewfinder .tr { top: 12px; right: 12px; border-left: 0; border-bottom: 0; border-radius: 0 14px 0 0; }
.viewfinder .bl { bottom: 12px; left: 12px; border-right: 0; border-top: 0; border-radius: 0 0 0 14px; }
.viewfinder .br { bottom: 12px; right: 12px; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
.viewfinder .line { position: absolute; left: 24px; right: 24px; height: 2px; background: var(--accent-2); box-shadow: 0 0 12px var(--accent-2); animation: scan 2s ease-in-out infinite; }
@keyframes scan { 0%, 100% { top: 30px; } 50% { top: 198px; } }
.viewfinder .qr { width: 140px; height: 140px; border-radius: 8px; opacity: .2; filter: blur(2px); transition: opacity .35s var(--ease-out), filter .35s var(--ease-out); }
.viewfinder.hit .qr { opacity: 1; filter: none; }
.viewfinder.hit .line { display: none; }
.viewfinder.hit .corner { border-color: var(--ok-on-dark); }
.detected { text-align: center; min-height: 54px; font-size: 14px; }
.detected .ok { color: var(--ok-on-dark); font-weight: 700; }
.detected code { font-size: 12.5px; color: #e4e7ec; }
.saved-row { margin: 8px auto 0; max-width: 300px; text-align: left; font-size: 12.5px; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .14); border-radius: 12px; padding: 8px 10px; color: #e4e7ec; }
.saved-row div { display: flex; justify-content: space-between; gap: 10px; }
.saved-row span { color: #98a2b3; }
.demo-pick { background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); border-radius: var(--radius); padding: 12px; margin-top: 8px; }
.demo-pick p { margin: 0 0 8px; font-size: 12.5px; color: #b3bac5; }
.chip { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 12px; background: rgba(255, 255, 255, .08); color: #fff; margin-top: 6px; text-align: left; }
@media (hover: hover) and (pointer: fine) { .chip:hover:not(:disabled) { background: rgba(255, 255, 255, .16); } }
.chip:disabled { opacity: .4; cursor: default; }
.chip .avatar { width: 30px; height: 30px; font-size: 12px; }
.chip small { color: #b3bac5; display: block; font-size: 12px; }
.urlrow { display: flex; gap: 6px; margin-top: 8px; }
.urlrow input { flex: 1; min-width: 0; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .08); color: #fff; padding: 8px 10px; font-size: 13px; }
.urlrow input::placeholder { color: #98a2b3; }
.urlrow button { border-radius: 10px; background: #fff; color: var(--ink); font-weight: 600; font-size: 13px; padding: 0 12px; }

/* ---------- note ---------- */
.linkchip { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--grey-soft); font-size: 13px; }
.linkchip code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--grey-soft); padding: 4px; border-radius: 12px; margin: 12px 0 10px; }
.seg button { padding: 9px 8px; border-radius: 11px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(23, 26, 33, .08); }
.prompts { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; }
.prompts span { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.linkbtn { font-size: 13px; font-weight: 600; color: var(--accent-ink); }
.mic-wrap { display: flex; flex-direction: column; align-items: center; margin: 10px 0 8px; }
.mic { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--accent-cta); }
.mic svg { width: 36px; height: 36px; }
.mic.rec { background: var(--danger); animation: pulse 1.4s ease-out infinite; }
.mic.rec .stopicon { width: 28px; height: 28px; border-radius: 6px; background: #fff; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(var(--danger-rgb), .3); } 100% { box-shadow: 0 0 0 24px rgba(var(--danger-rgb), 0); } }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; margin-top: 10px; }
.wave { display: flex; gap: 3px; align-items: center; height: 34px; margin-top: 6px; }
.wave i { width: 4px; border-radius: 2px; background: var(--accent); height: 6px; transition: height .12s; }
.transcript { min-height: 80px; font-size: 14.5px; }
.transcript .caret { display: inline-block; width: 2px; height: 1em; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- processing ---------- */
.proc { display: flex; flex-direction: column; align-items: center; padding-top: 40px; }
.orb { width: 88px; height: 88px; border-radius: 50%; background: var(--accent-2); }
.steps { list-style: none; padding: 0; margin: 28px 0 0; width: 100%; }
.steps li { display: flex; align-items: center; gap: 12px; padding: 10px 4px; color: var(--muted); animation: rise .45s ease both; }
.steps li:nth-child(2) { animation-delay: .12s; }
.steps li:nth-child(3) { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.steps li .ic { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 12px; }
.steps li.doing { color: var(--ink); font-weight: 600; }
.steps li.doing .ic { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
.steps li.done { color: var(--ink); }
.steps li.done .ic { background: var(--ok); border-color: var(--ok); color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- review / detail ---------- */
.who { display: flex; gap: 12px; align-items: center; }
.who .avatar { width: 54px; height: 54px; font-size: 18px; }
.who .n { font-size: 19px; font-weight: 700; }
.who .r { color: var(--muted); font-size: 13.5px; }
.match { border: 1px solid var(--line); border-left: 3px solid var(--ai); background: var(--ai-soft); border-radius: var(--radius); padding: 14px; margin-top: 14px; }
.match .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.match .reason { font-size: 13.5px; margin-top: 8px; }
ul.bul { margin: 0; padding-left: 18px; }
ul.bul li { margin: 3px 0; }
.footer { position: sticky; bottom: -24px; margin: 18px -18px -24px; padding: 12px 18px 18px; background: linear-gradient(180deg, rgba(255, 255, 255, 0), var(--phone) 30%); }
.copy { font-size: 12.5px; font-weight: 600; color: var(--accent-ink); }
.label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 6px; display: flex; justify-content: space-between; align-items: center; }
.label .ai { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: var(--ai-soft); color: var(--ai); text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 650; }
.label .label-actions { display: inline-flex; align-items: center; gap: 10px; }
.nextstep { display: flex; gap: 10px; align-items: center; }
.btn-done { background: var(--ok-soft); color: var(--ok); }

/* ---------- saved ---------- */
.success { text-align: center; padding: 16px 0 6px; }
.success .check { width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; margin: 0 auto 10px; font-size: 30px; animation: pop .4s ease-out; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.phase2 { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 12px; }
.phase2 .n-logo { width: 20px; height: 20px; border: 1.5px solid var(--muted); border-radius: 4px; font-size: 11px; font-weight: 800; display: grid; place-items: center; color: var(--muted); flex: none; }

/* ---------- projects ---------- */
.proj-card, .projects-import { margin-bottom: 10px; }
.proj-card.display { padding: 16px; box-shadow: var(--shadow); transition: transform .18s var(--ease-out), box-shadow .18s var(--ease-out), border-color .18s; }
.projects-import { box-shadow: var(--shadow); }
.proj-card .ph { display: flex; gap: 8px; align-items: center; font-weight: 700; }
.proj-card .ph > span:nth-child(2) { overflow-wrap: anywhere; }
.proj-card .emoji { width: 36px; height: 36px; border-radius: 10px; background: var(--grey-soft); display: grid; place-items: center; font-size: 18px; }
.proj-card .goal { color: var(--muted); font-size: 13.5px; margin: 6px 0 8px; }
.proj-card .goal { overflow-wrap: anywhere; }
.proj-actions { display: flex; gap: 8px; flex: none; }
.proj-action { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--grey-soft); }
.proj-action svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.proj-action.delete { color: var(--danger); }
.faces { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.proj-card.display { cursor: pointer; }
.proj-card .faces { gap: 0; }
.face { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 12.5px; font-weight: 700; border: 2px solid #fff; }
.face + .face { margin-left: -8px; }
.face-more { background: var(--line); color: var(--muted); font-size: 11px; }
.dropzone.flash { outline: 2px solid var(--accent); outline-offset: 3px; }
details.card > summary { min-height: 44px; display: flex; align-items: center; }

/* ---------- collapsible contact groups ---------- */
.group-toggle { width: 100%; cursor: pointer; display: flex; align-items: center; gap: 6px; min-height: 44px; text-align: left; }
.group-toggle .chev { display: inline-block; transition: transform .2s var(--ease-out); }
.group-toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }

/* ---------- restrained interaction feedback ---------- */
.btn, .scan-cta, .icon-btn, .chip, .proj-action, .seg button, .urlrow button, .tabbar button, .tabbar a, .pchip { transition: background-color .16s, color .16s, border-color .16s, transform .16s var(--ease-out), box-shadow .16s; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover:not(:disabled), .icon-btn:hover, .proj-action:hover, .chip:hover:not(:disabled), .pchip:hover, .seg button:hover { background-color: var(--grey-soft); }

}
.btn:focus-visible, .icon-btn:focus-visible, .proj-action:focus-visible, .chip:focus-visible, .pchip:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 2px; }
.pchip:active, .btn:active:not(:disabled), .scan-cta:active, .icon-btn:active, .proj-action:active, .seg button:active, .tabbar button:active, .tabbar a:active { transform: scale(.98); }

/* ---------- toasts (Sonner-style: transitions, not keyframes; interruptible) ---------- */
.toasts { position: absolute; left: 14px; right: 14px; bottom: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 60; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 8px; max-width: 100%; background: var(--sidebar); color: #fff; font-size: 13.5px; font-weight: 500; line-height: 1.4; padding: 10px 15px; border-radius: var(--radius); box-shadow: var(--shadow-raised); transition: transform .35s var(--ease-out), opacity .35s var(--ease-out); }
.toast::before { font-weight: 800; flex: none; }
.toast.success::before { content: '✓'; color: var(--ok-on-dark); }
.toast.error::before { content: '!'; color: #e6ad9d; }
.toast[data-state="pre"] { opacity: 0; transform: translateY(14px) scale(.97); }
.toast[data-state="out"] { opacity: 0; transform: translateY(8px) scale(.97); transition-duration: .2s; }

/* ---------- bottom action sheet (replaces confirm(); iOS drawer curve from Vaul) ---------- */
.sheet-wrap { position: absolute; inset: 0; z-index: 55; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(23, 26, 33, .42); opacity: 0; transition: opacity .3s ease; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--phone); border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateY(100%); transition: transform .45s var(--ease-drawer); box-shadow: 0 -12px 40px rgba(0, 0, 0, .22); }
.set-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.set-row span { color: var(--muted); flex: none; }
.set-row b { font-weight: 600; text-align: right; }
.sheet-wrap.open .sheet-scrim { opacity: 1; }
.sheet-wrap.open .sheet { transform: translateY(0); }
.sheet-wrap:not(.open) .sheet { transition-duration: .3s; }
.sheet-wrap:not(.open) .sheet-scrim { transition-duration: .2s; }
.sheet .grab { width: 36px; height: 4px; border-radius: 999px; background: var(--line); margin: 0 auto 14px; }
.sheet h3 { margin: 0 0 4px; font-size: 16.5px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.sheet p { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; }
.sheet .btn { width: 100%; margin-top: 8px; }
.btn-danger { background: var(--danger); color: #fff; }
@media (min-width: 901px) {
  .sheet-wrap { display: grid; place-items: center; padding: 24px; }
  .sheet { position: relative; left: auto; right: auto; bottom: auto; width: min(420px, 100%); border-radius: 18px; transform: translateY(12px) scale(.98); box-shadow: 0 16px 40px rgba(23, 26, 33, .18); }

}
@media (max-width: 900px) { .toasts { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); } }

  input, textarea, select { font-size: 16px; }
}

  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }

<script>
const ACTIVE_KEY = 'syncy-active-event';

// ---------- toast + action sheet (replace alert()/confirm()) ----------
function toast(message, opts = {}) {
  const workspace = document.querySelector('.workspace');
  let host = document.getElementById('toasts');
  if (!host) { host = document.createElement('div'); host.id = 'toasts'; host.className = 'toasts'; host.setAttribute('aria-live', 'polite'); workspace.appendChild(host); }
  while (host.children.length >= 3) host.firstChild.remove();
  const el = document.createElement('div');
  el.className = `toast ${opts.type || ''}`.trim();
  el.setAttribute('role', 'status');
  el.textContent = message;
  el.dataset.state = 'pre';
  host.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => { delete el.dataset.state; }));
  const hide = () => {
    if (el.dataset.state === 'out') return;
    el.dataset.state = 'out';
    el.addEventListener('transitionend', () => el.remove(), { once: true });
    setTimeout(() => el.remove(), 350);
  };
  setTimeout(hide, opts.duration || (opts.type === 'error' ? 5000 : 3000));
  el.addEventListener('click', hide);
}
function confirmSheet({ title, message, confirmLabel = 'Confirm', cancelLabel = 'Cancel', danger = false }) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.innerHTML = `<div class="sheet-scrim"></div>
      <div class="sheet" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="grab"></div>
        <h3>${esc(title)}</h3>${message ? `<p>${esc(message)}</p>` : ''}
        <button class="btn btn-block ${danger ? 'btn-danger' : 'btn-primary'}" data-act="yes">${esc(confirmLabel)}</button>
        <button class="btn btn-block" data-act="no">${esc(cancelLabel)}</button>
      </div>`;
    document.querySelector('.workspace').appendChild(wrap);
    const done = result => {
      document.removeEventListener('keydown', onKey, true);
      wrap.classList.remove('open');
      wrap.querySelector('.sheet').addEventListener('transitionend', () => wrap.remove(), { once: true });
      setTimeout(() => wrap.remove(), 450);
      resolve(result);
    };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', onKey, true);
    wrap.querySelector('.sheet-scrim').addEventListener('click', () => done(false));
    wrap.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => done(b.dataset.act === 'yes')));
    requestAnimationFrame(() => requestAnimationFrame(() => {
      wrap.classList.add('open');
      wrap.querySelector('[data-act="no"]').focus();
    }));
  });
}

// ---------- settings (gear in every tab's top-right) ----------
const GEAR_SVG = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01A1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01c.26.63.87 1.04 1.56 1.04H21a2 2 0 1 1 0 4h-.09c-.69 0-1.3.41-1.51 1.03Z"/></svg>`;
const gearBtn = () => `<button class="icon-btn" type="button" aria-label="Settings" title="Settings" onclick="openSettings()">${GEAR_SVG}</button>`;
function openSettings() {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet-scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="grab"></div>
      <h3>Settings</h3>
      <div class="set-row"><span>Account</span><b>${db.live ? esc(db.user?.email || 'Signed in') : 'Not connected'}</b></div>
      <div class="set-row"><span>Voice memos</span><b>Transcribed only, audio never stored</b></div>
      ${db.live ? '' : '<button class="btn btn-block" style="margin-top:14px" data-act="reset">Reset demo data</button>'}
      <button class="btn btn-block btn-danger" ${db.live ? 'style="margin-top:14px"' : ''} data-act="signout">Sign out</button>
      <button class="btn btn-block" data-act="close">Close</button>
    </div>`;
  document.querySelector('.workspace').appendChild(wrap);
  const done = () => {
    document.removeEventListener('keydown', onKey, true);
    wrap.classList.remove('open');
    wrap.querySelector('.sheet').addEventListener('transitionend', () => wrap.remove(), { once: true });
    setTimeout(() => wrap.remove(), 450);
  };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(); } };
  document.addEventListener('keydown', onKey, true);
  wrap.querySelector('.sheet-scrim').addEventListener('click', done);
  wrap.querySelector('[data-act="close"]').addEventListener('click', done);
  wrap.querySelector('[data-act="reset"]')?.addEventListener('click', () => { localStorage.clear(); location.reload(); });
  wrap.querySelector('[data-act="signout"]').addEventListener('click', async () => { done(); await signOut(); });
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
}

// Demo profiles to "scan". Their notes come with a scripted AI result; any other note goes through simulateAI's heuristic.
const PERSONAS = [
  {
    url: 'linkedin.com/in/lena-hoffmann-demo', role: 'Head of Procurement', company: 'Nordlicht Logistics',
    note: "Lena, head of procurement at Nordlicht Logistics. They're rebuilding their warehouse KPI dashboard and need a React freelancer from January, budget is already approved. She asked me to send a short portfolio, and I said I'd call her next Tuesday.",
    ai: {
      summary: 'Rebuilding the warehouse KPI dashboard; budget approved for a React freelancer from January.',
      discussed: ['Nordlicht is rebuilding its warehouse KPI dashboard', 'Budget for an external developer is approved', 'Start date: January'],
      needs: 'A React freelancer for the dashboard rebuild, from January.',
      project_id: 'pr-client', match_confidence: 'high',
      match_reason: 'Approved budget for exactly the React dashboard work you want for Q1: “need a React freelancer from January, budget is already approved”.',
      next_step: 'Send portfolio, then call her', next_step_date: '2026-10-27',
      follow_up_draft: "Hi Lena, great talking at the BCBT hackathon about Nordlicht's warehouse dashboard. As promised, here is my portfolio with two similar KPI dashboards I built in React. Would Tuesday at 10:00 work for a quick call?",
    },
  },
  {
    url: 'xing.com/profile/Jonas_Weber_demo', role: 'Sales lead (HR software)', company: 'Between jobs',
    note: "Jonas, he sold HR software to mid-size companies for six years and just left his job. He's looking for an early-stage HR-tech startup to join as a co-founder. We talked about onboarding being a mess everywhere. He wants to see my prototype, coffee next week.",
    ai: {
      summary: 'Sold HR software for six years, just left his job, looking to co-found an HR-tech startup.',
      discussed: ['Six years selling HR software to mid-size companies', 'Just left his job, looking to co-found', 'Agrees onboarding is a common pain'],
      needs: 'An early-stage HR-tech startup to join as co-founder.',
      project_id: 'pr-cofounder', match_confidence: 'high',
      match_reason: 'The sales-minded HR-tech co-founder profile your project is looking for: “looking for an early-stage HR-tech startup to join as a co-founder”.',
      next_step: 'Coffee + show him the prototype', next_step_date: '2026-10-29',
      follow_up_draft: "Hi Jonas, really enjoyed our chat about onboarding chaos at the BCBT hackathon. I'd love to show you the prototype. Does coffee on Thursday near Görlitzer Park work for you?",
    },
  },
];
const personaFor = url => PERSONAS.find(p => parseProfile(p.url).profile_url === url);

const COLORS = ['var(--avatar-rust)', 'var(--avatar-forest)', 'var(--avatar-blue)', 'var(--avatar-violet)', 'var(--avatar-teal)', 'var(--avatar-ochre)', 'var(--avatar-steel)', 'var(--avatar-slate)'];
const STAGE_LABEL = { to_follow_up: 'To follow up', followed_up: 'Followed up', meeting_set: 'Meeting set', won: 'Won', not_relevant: 'Not relevant' };

let ui;
let notionUi = { connected: false, workspace: '', sources: [], selected: '', busy: false, message: '' };
let navigationReady = false;
let currentNavigationKey = null;
let recordingRequest = 0;
const navigationSnapshots = new Map();
const transcriptionRequests = new Map();
const activeProcesses = new Map();
window.syncyVoiceDebug = (id, stage, details = {}) => console.info('[VOICE-DEBUG]', id, stage, details);
function freshUi() {
  let eventId = null;
  try { eventId = localStorage.getItem(ACTIVE_KEY); } catch (e) { /* no storage: start at the picker */ }
  if (eventId && !db.get('events', eventId)) eventId = null;
  return {
    tab: 'today', screen: 'today', eventId, pickId: null, eventForm: null,
    contactId: null, draft: null, from: null,
    noteMode: 'voice', noteText: '', rec: { status: 'idle', secs: 0, words: 0 },
    justScanned: null, projForm: null, evConfirm: null,
  };
}
function setActiveEvent(id) {
  ui.eventId = id;
  try { id ? localStorage.setItem(ACTIVE_KEY, id) : localStorage.removeItem(ACTIVE_KEY); } catch (e) { /* in-memory only */ }
}
// ---------- helpers ----------
let timers = [];
function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
function every(fn, ms) { const t = setInterval(fn, ms); timers.push(t); return t; }
function clearTimers() { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const projects = () => db.list('projects').filter(p => !p.archived);
const proj = id => id && db.get('projects', id);
const event = id => id && db.get('events', id);
const eventContacts = id => db.list('contacts').filter(c => c.event_id === id).sort((a, b) => b.scanned_at.localeCompare(a.scanned_at));
function initials(name) { return (name || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase(); }
function color(name) { let h = 0; for (const c of name || '?') h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
function avatar(name, size) {
  const st = size ? `width:${size}px;height:${size}px;font-size:${Math.round(size * .36)}px;` : '';
  return `<span class="avatar" style="background:${color(name)};${st}">${esc(initials(name))}</span>`;
}
// With a url, the badge is a link that opens the profile (clicks don't bubble into the row).
function srcBadge(source, url) {
  const cls = source === 'qr_xing' ? 'src xi' : source === 'qr_linkedin' ? 'src li' : 'src ot';
  const label = source === 'qr_xing' ? 'X' : source === 'qr_linkedin' ? 'in' : '↗';
  const href = url && normalizeUrl(url);
  if (!href) return `<span class="${cls}">${label}</span>`;
  return `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="Open ${SOURCE_LABEL[source] || 'profile'}" onclick="event.stopPropagation()">${label}</a>`;
}
function initials2(name) { return (String(name || '?').replace(/[^\p{L}\p{N}]/gu, '').slice(0, 2) || '?').toUpperCase(); }
function projTag(p) { return `<span class="ptag" style="background:${color(p.name)}">${esc(initials2(p.name))}</span>`; }
function projThumb(p) { return p.emoji && p.emoji !== '📌' ? `<span class="pthumb" style="background:var(--grey-soft)">${esc(p.emoji)}</span>` : `<span class="pthumb" style="background:${color(p.name)}">${esc(initials2(p.name))}</span>`; }
const SOURCE_LABEL = { qr_linkedin: 'LinkedIn', qr_xing: 'Xing', qr_other: 'Profile', manual: 'Manual' };
function fmtDate(iso) { return iso ? new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : ''; }
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function nowIso() { return new Date().toISOString(); }

function qrSvg(seed) {
  let s = 7; for (const c of seed) s = (s * 31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const inFinder = (x, y) => (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
  let cells = '';
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) if (!inFinder(x, y) && rnd() < .5) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return `<svg class="qr" viewBox="-1.5 -1.5 24 24"><rect x="-1.5" y="-1.5" width="24" height="24" fill="#fff"/><g fill="#111">${finder(0, 0)}${finder(14, 0)}${finder(0, 14)}${cells}</g></svg>`;
}

// ---------- navigation ----------
function captureNavigationState(key = currentNavigationKey || history.state?.key || crypto.randomUUID()) {
  return JSON.parse(JSON.stringify({
    syncy: true, key, screen: ui.screen, tab: ui.tab,
    scrollTop: document.getElementById('screen')?.scrollTop || 0,
    eventId: ui.eventId, pickId: ui.pickId, eventForm: ui.eventForm,
    contactId: ui.contactId, draft: ui.draft, from: ui.from,
    noteMode: ui.noteMode, noteText: ui.noteText,
    rec: { status: ui.rec.status === 'recording' ? 'transcribing' : ui.rec.status, secs: ui.rec.secs, words: ui.rec.words },
    justScanned: ui.justScanned, projForm: ui.projForm,
    evConfirm: ui.evConfirm, editUrl: ui.editUrl, error: ui.error,
    fields: [...document.querySelectorAll('#screen input, #screen textarea, #screen select')].map(el => ({
      id: el.id, value: el.value, checked: 'checked' in el ? el.checked : undefined,
    })),
  }));
}

function saveNavigationState() {
  if (!navigationReady || !currentNavigationKey) return;
  const snapshot = captureNavigationState(currentNavigationKey);
  navigationSnapshots.set(snapshot.key, snapshot);
  if (history.state?.key === snapshot.key) history.replaceState({ syncy: true, key: snapshot.key, screen: snapshot.screen, tab: snapshot.tab, scrollTop: snapshot.scrollTop }, '', location.href);
}

function stopNoteRecordingForNavigation(nextScreen, leavingEntry = false) {
  if (ui.screen !== 'note' || (!leavingEntry && nextScreen === 'note')) return;
  recordingRequest++;
  if (ui.rec.status === 'recording' && ui.rec.recorder?.state === 'recording') {
    ui.rec.status = 'transcribing';
    clearInterval(ui.rec.timer);
    ui.rec.recorder.stop();
  }
}

function go(screen, force = false) {
  if (!force && ['today', 'contacts', 'projects'].includes(screen) && ui.screen === screen && ui.tab === screen) {
    document.getElementById('screen').scrollTop = 0;
    return;
  }
  stopNoteRecordingForNavigation(screen);
  if (ui.screen === 'scan' && screen !== 'scan') stopCameraScan();
  saveNavigationState();
  clearTimers();
  if (['today', 'contacts', 'projects'].includes(screen)) ui.tab = screen;
  ui.screen = screen;
  if (screen !== 'contacts') ui.sel = null;
  if (navigationReady) {
    const snapshot = captureNavigationState(crypto.randomUUID());
    navigationSnapshots.set(snapshot.key, snapshot);
    history.pushState({ syncy: true, key: snapshot.key, screen: snapshot.screen, tab: snapshot.tab, scrollTop: snapshot.scrollTop }, '', location.href);
    currentNavigationKey = snapshot.key;
  }
  render();
  document.getElementById('screen').scrollTop = 0;
  saveNavigationState();
}

function restoreNavigationState(snapshot) {
  if (snapshot && ['note', 'processing', 'review', 'saved', 'detail'].includes(snapshot.screen) && !db.get('contacts', snapshot.contactId)) {
    snapshot = { ...snapshot, screen: ['today', 'contacts', 'projects'].includes(snapshot.tab) ? snapshot.tab : 'today', contactId: null, draft: null };
  }
  if (!snapshot || !['today', 'contacts', 'projects', 'scan', 'note', 'processing', 'review', 'saved', 'detail'].includes(snapshot.screen)) return;
  currentNavigationKey = snapshot.key || history.state?.key || crypto.randomUUID();
  if (ui.screen === 'scan' && snapshot.screen !== 'scan') stopCameraScan();
  clearTimers();
  Object.assign(ui, {
    screen: snapshot.screen,
    tab: ['today', 'contacts', 'projects'].includes(snapshot.tab) ? snapshot.tab : 'today',
    eventId: snapshot.eventId || null, pickId: snapshot.pickId || null, eventForm: snapshot.eventForm || null,
    contactId: snapshot.contactId || null, draft: snapshot.draft || null, from: snapshot.from || null,
    noteMode: snapshot.noteMode || 'voice', noteText: snapshot.noteText || '',
    rec: snapshot.rec || { status: 'idle', secs: 0, words: 0 },
    justScanned: snapshot.justScanned || null, projForm: snapshot.projForm || null,
    evConfirm: snapshot.evConfirm || null, editUrl: Boolean(snapshot.editUrl), error: snapshot.error || null,
  });
  setActiveEvent(ui.eventId);
  render();
  const fields = [...document.querySelectorAll('#screen input, #screen textarea, #screen select')];
  (snapshot.fields || []).forEach((field, index) => {
    const input = field.id ? document.getElementById(field.id) : fields[index];
    if (!input) return;
    input.value = field.value;
    if (field.checked !== undefined) input.checked = field.checked;
  });
  document.getElementById('screen').scrollTop = snapshot.scrollTop || 0;
  saveNavigationState();
}

function replaceCurrentScreen(screen) {
  if (ui.screen === 'scan' && screen !== 'scan') stopCameraScan();
  clearTimers();
  ui.screen = screen;
  render();
  document.getElementById('screen').scrollTop = 0;
  saveNavigationState();
}

function render() {
  if (['note', 'processing', 'review', 'saved', 'detail'].includes(ui.screen) && !db.get('contacts', ui.contactId || ui.draft?.id)) {
    ui.screen = ui.tab; ui.contactId = null; ui.draft = null;
  }
  const el = document.getElementById('screen');
  const screenChanged = el.dataset.screen && el.dataset.screen !== ui.screen;
  el.dataset.screen = ui.screen;
  const flow = ['scan', 'note', 'processing', 'review', 'saved', 'detail'].includes(ui.screen);
  el.className = 'screen' + (ui.screen === 'scan' ? ' dark' : '') + (flow ? ' flow' : '');
  el.innerHTML = SCREENS[ui.screen]();
  if (screenChanged && el.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 190, easing: 'cubic-bezier(.23, 1, .32, 1)' });
  }
  const tb = document.getElementById('tabbar');
  tb.style.display = flow ? 'none' : 'flex';
  document.querySelector('.side').classList.toggle('flow-hidden', flow);
  tb.innerHTML = [['today', 'Today'], ['contacts', 'Contacts'], ['projects', 'Projects']]
    .map(([id, label]) => `<button type="button" class="${ui.tab === id ? 'on' : ''}" aria-current="${ui.tab === id ? 'page' : 'false'}" onclick="go('${id}')">${ICONS[id]}<span class="tlbl">${label}</span></button>`).join('')
    + `<a href="dashboard.html">${ICONS.dash}<span class="tlbl">Dashboard</span></a>`;
  const sideKey = ui.screen === 'today' && !ui.eventId ? 'picker' : ui.screen;
  document.querySelectorAll('#sideSteps li').forEach(li => li.classList.toggle('on', li.dataset.s === sideKey));
  AFTER[ui.screen]?.();
}

  const key = pid || 'none';
  const collapsed = (ui.collapsed || (ui.collapsed = {}))[key];
  return `<div class="dropzone" data-pid="${pid}">

    ${collapsed ? '' : (list.length ? list.map(c => personRow(c, true)).join('') : `<div class="empty small">${emptyText}</div>`)}</div>`;
}
function toggleGroup(key) {
  ui.collapsed = ui.collapsed || {};
  ui.collapsed[key] = !ui.collapsed[key];
  render();
}
function personRow(c, assignable) {
  const p = proj(c.project_id);
  const selecting = assignable && Array.isArray(ui.sel);
  const checked = selecting && ui.sel.includes(c.id);
  const act = selecting ? `toggleSel('${c.id}')` : `openContact('${c.id}')`;
  const status = c.status === 'captured'

      <div class="name">${esc(c.name || c.profile_slug)} ${srcBadge(c.source, c.profile_url)}</div>
      <div class="role">${c.role || c.company ? esc([c.role, c.company].filter(Boolean).join(' · ')) : esc(c.profile_url)}</div>
      <div class="next">${status}</div>
    </div></div>`;
}

// ---------- after-render hooks ----------
function procSteps(c) {
  return ['Summarising your note',
    c.project_set_by === 'user' ? 'Keeping the project you picked' : `Comparing with your ${projects().length} projects`,
    'Drafting a follow-up'];
}
// Live mode: real progress is unknown, so pace the checklist on a clock and
// keep the last step spinning until the Edge Function comes back.
const LIVE_STEP_MS = 2600;
function animateLiveSteps() {
  const lis = [...document.querySelectorAll('#steps li')];
  if (!lis.length) return;
  if (!ui.procT0) ui.procT0 = Date.now();
  const paint = () => {
    const k = Math.min(Math.floor((Date.now() - ui.procT0) / LIVE_STEP_MS), lis.length - 1);
    lis.forEach((li, i) => {
      li.className = i < k ? 'done' : i === k ? 'doing' : '';
      li.querySelector('.ic').textContent = i < k ? '✓' : '';
    });
    if (k < lis.length - 1) { clearTimeout(ui.procTick); ui.procTick = later(paint, LIVE_STEP_MS - ((Date.now() - ui.procT0) % LIVE_STEP_MS) + 30); }
  };
  paint();
}
const AFTER = {
  contacts() {
    if (!ui.focusProject) return;
    const pid = ui.focusProject;
    ui.focusProject = null;
    // Next tick: go() resets the screen's scrollTop right after render.
    later(() => {
      const zone = document.querySelector(`.dropzone[data-pid="${pid}"]`);
      if (!zone || ui.screen !== 'contacts') return;
      zone.scrollIntoView({ behavior: 'smooth', block: 'start' });
      zone.classList.add('flash');
      setTimeout(() => zone.classList.remove('flash'), 1600);
    }, 0);
  },
  scan() { if (db.live && !ui.justScanned && window.Html5Qrcode && !ui.scanner) startCameraScan(); },
  processing() {
    if (db.live) {
      const c = db.get('contacts', ui.contactId);
      if (c?.status === 'processing') runLiveProcess();
      else if (c?.status === 'review') { ui.draft = c; ui.from = 'note'; replaceCurrentScreen('review'); }
      animateLiveSteps();
      return;
    }
    const lis = [...document.querySelectorAll('#steps li')];
    lis.forEach((li, i) => {
      later(() => { li.className = 'doing'; }, i * 650);
      later(() => { li.className = 'done'; li.querySelector('.ic').textContent = '✓'; }, i * 650 + 600);
    });
    later(() => {
      const c = db.get('contacts', ui.contactId);
      // A project picked by hand after the scan wins over the AI's suggestion.
      const keep = c.project_set_by === 'user'
        ? { project_id: c.project_id, project_set_by: 'user', match_confidence: null, match_reason: c.match_reason }
        : { project_set_by: 'ai' };
      ui.draft = db.update('contacts', c.id, { ...simulateAI(c), ...keep, status: 'review' });
      ui.from = 'note';
      go('review');
    }, lis.length * 650 + 300);
  },
};

// ---------- actions: event ----------
// Reads an event-link input; returns undefined (and shows why) when it isn't a usable web address.
function readEventUrl(inputId) {
  const raw = document.getElementById(inputId).value;
  const url = normalizeUrl(raw);
  if (raw.trim() && !url) {
    document.getElementById('evUrlErr').textContent = 'That doesn’t look like a web address.';
    document.getElementById(inputId).focus();
    return undefined;
  }
  return url;
}
function openEventForm(which) {
  ui.eventForm = which;
  render();
  document.getElementById('evName').focus();
}
// Creates the event (ui.eventForm = 'new') or updates the one being edited.
async function saveEvent() {
  const name = document.getElementById('evName').value.trim();
  if (!name) { document.getElementById('evName').focus(); return; }
  const url = readEventUrl('evUrl');
  if (url === undefined) return;
  const fields = { name, location: document.getElementById('evLoc').value.trim() || null, url, starts_on: document.getElementById('evDate').value || db.TODAY };
  const ev = ui.eventForm === 'new' ? db.insert('events', fields) : db.update('events', ui.eventForm, fields);
  if (db.live) {
    try { await db.flush('events', ev.id); }
    catch { document.getElementById('evUrlErr').textContent = 'Could not save the event. Check your connection and try again.'; return; }
  }
  ui.pickId = ev.id; ui.eventForm = null;
  render();
}
function saveEventUrl(remove = false) {
  const url = remove ? null : readEventUrl('evUrlEdit');
  if (url === undefined) return;
  db.update('events', ui.eventId, { url });
  ui.editUrl = false;
  render();
}
function enterEvent() { const id = ui.pickId; ui.editUrl = false; go('today', true); setActiveEvent(id); render(); saveNavigationState(); }
function leaveEvent() { ui.editUrl = false; go('today', true); setActiveEvent(null); render(); saveNavigationState(); }

function startScan() { ui.justScanned = null; go('scan'); }
function startCameraScan() {
  if (ui.scanner || !document.getElementById('qr-reader')) return;
  ui.scanner = new Html5Qrcode('qr-reader');

// Drag a contact card onto a project group. Pointer events so one code path covers
// mouse (drag after a small move) and touch (press-and-hold, so plain scrolling still works).
let drag = null, suppressClick = false;
const DRAG_HOLD_MS = 300, DRAG_SLOP = 8;
const dragPreventScroll = e => e.preventDefault();
function startDrag(x, y) {
  const r = drag.card.getBoundingClientRect();
  const ghost = drag.card.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.style.width = r.width + 'px';
  document.body.appendChild(ghost);
  Object.assign(drag, { ghost, dx: x - r.left, dy: y - r.top, started: true });
  drag.card.classList.add('drag-src');
  document.addEventListener('touchmove', dragPreventScroll, { passive: false });
  moveDrag(x, y);
}
function moveDrag(x, y) {
  drag.ghost.style.transform = `translate(${x - drag.dx}px, ${y - drag.dy}px)`;
  drag.ghost.style.display = 'none';
  const zone = document.elementFromPoint(x, y)?.closest('.dropzone') || null;
  drag.ghost.style.display = '';
  document.querySelectorAll('.dropzone.over').forEach(z => z !== zone && z.classList.remove('over'));
  zone?.classList.add('over');
  drag.zone = zone;
}
function endDrag(drop) {
  if (!drag) return;
  clearTimeout(drag.timer);
  document.removeEventListener('touchmove', dragPreventScroll);
  document.querySelectorAll('.drag-src').forEach(el => el.classList.remove('drag-src'));
  document.querySelectorAll('.dropzone.over').forEach(z => z.classList.remove('over'));
  drag.ghost?.remove();
  const { id, zone, started } = drag;
  drag = null;
  if (!started) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if (drop && zone) { assignContactsTo(zone.dataset.pid || null, [id]); render(); }
}
document.addEventListener('pointerdown', e => {
  if (ui.screen !== 'contacts' || Array.isArray(ui.sel) || e.button) return;
  const card = e.target.closest('.person[data-cid]');
  if (!card) return;
  drag = { id: card.dataset.cid, card, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, started: false, zone: null,
    timer: e.pointerType === 'mouse' ? null : setTimeout(() => drag && startDrag(drag.lx, drag.ly), DRAG_HOLD_MS) };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.lx = e.clientX; drag.ly = e.clientY;
  if (drag.started) return moveDrag(e.clientX, e.clientY);
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) <= DRAG_SLOP) return;
  if (e.pointerType === 'mouse') startDrag(e.clientX, e.clientY);
  else { clearTimeout(drag.timer); drag = null; } // finger is scrolling, not dragging
});
document.addEventListener('pointerup', () => endDrag(true));
document.addEventListener('pointercancel', () => endDrag(false));
document.addEventListener('contextmenu', e => { if (drag?.started) e.preventDefault(); });
document.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);

function recordLive() {

// ---------- AI stand-in ----------
// Real build: LLM call 1 (summarise) + call 2 (compare with projects, draft) per PRD §9.
// Here: the scripted result for a demo persona's untouched note, otherwise a simple keyword heuristic.
const STOP = new Set('a an and are as at be but by for from has have he her him his i if in is it its me my of on or our she so that the their them they this to was we were will with you your about also just very really who what when where which would could should there then than been into over more some any can did does not out up our ours us met talked said told'.split(' '));
const stem = w => w.replace(/(ings?|ers?|es|s)$/, '');
const words = s => (s.toLowerCase().match(/[a-zäöüß][a-zäöüß-]+/g) || []).filter(w => w.length > 2 && !STOP.has(w));

function simulateAI(c) {
  const persona = personaFor(c.profile_url);
  if (persona && c.note_text === persona.note) return { role: persona.role, company: persona.company, ...persona.ai };

  const note = c.note_text || '';
  const sentences = note.split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);
  const clip = s => s.length > 140 ? s.slice(0, 137).trimEnd() + '…' : s;
  const noDot = s => s.replace(/[.!?]+$/, '');

  const scored = projects().map(p => {
    const vocab = new Set(words(`${p.name} ${p.description}`).map(stem));
    const hits = [...new Set(words(note).filter(w => vocab.has(stem(w))))];
    return { p, hits };
  }).sort((a, b) => b.hits.length - a.hits.length);
  const best = scored[0] && scored[0].hits.length ? scored[0] : null;

  const needs = sentences.find(s => /\b(need|needs|looking for|wants?|searching|hiring)\b/i.test(s)) || '';
  const next = sentences.find(s => /\b(call|send|meet|coffee|follow|email|write|book|intro|catch up)\b/i.test(s)) || '';
  const first = (c.name || '').split(' ')[0] || 'there';
  const ev = event(c.event_id);

  return {
    summary: clip(noDot(sentences[0] || note)) || null,
    discussed: sentences.slice(1, 4).map(s => clip(noDot(s))),
    needs: needs ? clip(noDot(needs)) : null,
    project_id: best ? best.p.id : null,
    match_confidence: best ? (best.hits.length >= 3 ? 'high' : best.hits.length === 2 ? 'medium' : 'low') : null,
    match_reason: best
      ? `Your note mentions ${best.hits.slice(0, 3).map(h => `“${h}”`).join(', ')}, which fits “${best.p.name}”.`
      : 'No clear overlap with your projects. Pick one yourself or leave it empty.',
    next_step: next ? clip(noDot(next)) : null,
    next_step_date: guessDate(next || note),
    follow_up_draft: `Hi ${first}, great to meet you${ev ? ' at ' + ev.name : ''}.${needs ? ' I keep thinking about what you said: ' + noDot(needs).replace(/^\w/, ch => ch.toLowerCase()) + '.' : ''} Would a short call next week work for you?`,
  };
}
function guessDate(text) {
  const t = text.toLowerCase();
  if (/\btomorrow\b/.test(t)) return addDays(db.TODAY, 1);
  if (/\bnext week\b/.test(t)) return addDays(db.TODAY, 7);
  const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  const i = days.findIndex(d => t.includes(d));
  if (i >= 0) {
    const today = new Date(db.TODAY + 'T12:00:00').getDay();
    return addDays(db.TODAY, ((i - today + 7) % 7) || 7);
  }
  return null;
}

  ui.projForm = null;
  render();
  if (db.live) { try { await db.flush('projects', id); } catch (error) { toast(`Could not save the project: ${error.message || error}`, { type: 'error' }); } }
}
// "Delete" archives the project: contacts keep their notes and history; the project just leaves matching and lists.
async function deleteProject(id) {
  const p = db.get('projects', id);
  if (!p) return;
  const ok = await confirmSheet({
    title: `Delete “${p.name}”?`,
    message: 'Contacts keep their notes; the project disappears from matching and lists.',
    confirmLabel: 'Delete project', cancelLabel: 'Keep project', danger: true,
  });
  if (!ok) return;
  db.update('projects', id, { archived: true });
  render();
  toast('Project deleted', { type: 'success' });
  if (db.live) { try { await db.flush('projects', id); } catch (error) { toast(`Could not delete the project: ${error.message || error}`, { type: 'error' }); } }
}
// Events hidden from the picker on this device; rows in Supabase are untouched, the dashboard still shows them.
const HIDDEN_EVENTS_KEY = 'syncy-hidden-events';
function hiddenEvents() { try { return JSON.parse(localStorage.getItem(HIDDEN_EVENTS_KEY)) || []; } catch (e) { return []; } }
function hideEvent(id) {
  try { localStorage.setItem(HIDDEN_EVENTS_KEY, JSON.stringify([...new Set([...hiddenEvents(), id])])); } catch (e) { /* no storage: hides for this page load only */ }
  if (ui.pickId === id) ui.pickId = null;
  if (ui.eventId === id) setActiveEvent(null);
  ui.evConfirm = null;
  render();
}

async function refreshNotionStatus() {
  try {
    const result = await db.notion('status');
    notionUi.connected = Boolean(result.connected);
    notionUi.workspace = result.workspace_name || '';
  } catch (error) {
    notionUi.connected = false;
    notionUi.message = error.message || 'Notion import is not configured yet.';
  }
}

async function connectNotion() {
  notionUi.busy = true; notionUi.message = ''; render();
  try {
    const redirectUri = new URL('notion-callback.html', location.origin).href;
    const result = await db.notion('start', { redirect_uri: redirectUri });
    location.assign(result.authorization_url);
  } catch (error) {
    notionUi.busy = false; notionUi.message = error.message || 'Could not start Notion connection.'; render();
  }
}

async function loadNotionSources() {
  notionUi.busy = true; notionUi.message = 'Loading databases shared with Syncy…'; render();
  try {
    const result = await db.notion('sources');
    notionUi.sources = result.sources || [];
    notionUi.selected = notionUi.sources.some(source => source.id === notionUi.selected) ? notionUi.selected : notionUi.sources[0]?.id || '';
    notionUi.message = notionUi.sources.length ? 'Choose the database that contains your projects.' : 'No shared databases found. Reconnect and share the projects database in Notion’s access picker.';
  } catch (error) { notionUi.message = error.message || 'Could not load Notion databases.'; }
  notionUi.busy = false; render();
}

async function importNotionProjects() {
  const sourceId = document.getElementById('notionSource')?.value || notionUi.selected;
  if (!sourceId) { notionUi.message = 'Choose a Notion projects database first.'; render(); return; }
  notionUi.busy = true; notionUi.message = 'Copying projects from Notion…'; render();
  try {
    const result = await db.notion('import', { data_source_id: sourceId });
    await db.reload(false);
    notionUi.message = `Imported ${result.added} new and refreshed ${result.updated} existing projects.${result.empty_descriptions ? ` ${result.empty_descriptions} have no description.` : ''}`;
  } catch (error) { notionUi.message = error.message || 'Could not import Notion projects.'; }
  notionUi.busy = false; render();
}

function copyText(btn, text) {
  navigator.clipboard?.writeText(text || '').catch(() => {});
  btn.textContent = 'Copied ✓';
  setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
}

window.addEventListener('db-change', () => { if (!['note', 'processing', 'review'].includes(ui.screen)) render(); });
window.addEventListener('db-error', e => toast(`Could not sync with Supabase: ${e.detail}`, { type: 'error' }));
window.addEventListener('auth-change', () => location.replace('login.html?next=index.html'));
window.addEventListener('popstate', event => {
  stopNoteRecordingForNavigation(event.state?.screen, true);
  if (ui.screen === 'scan' && event.state?.screen !== 'scan') stopCameraScan();
  clearTimers();
  const previous = currentNavigationKey && captureNavigationState(currentNavigationKey);
  if (previous) navigationSnapshots.set(previous.key, previous);
  if (!event.state?.syncy) return;
  restoreNavigationState(navigationSnapshots.get(event.state.key) || event.state);
});
document.addEventListener('input', saveNavigationState);
document.addEventListener('change', saveNavigationState);
document.addEventListener('click', saveNavigationState);
async function signOut() { if (!db.live) { location.reload(); return; } try { await db.signOut(); } catch (error) { toast(`Could not sign out: ${error.message}`, { type: 'error' }); } }
ui = freshUi();
db.init().then(authenticated => {
  if (!authenticated) { location.replace('login.html?next=index.html'); return; }
  document.getElementById('sideIntro').textContent = db.user.email || 'Your account';
  document.getElementById('sideNote').textContent = 'Contacts and notes are private to this account. Voice audio is transcribed, never stored.';
  ui = freshUi();
  const params = new URLSearchParams(location.search);
  const initialTab = params.get('tab');
  if (['today', 'contacts', 'projects'].includes(initialTab)) { ui.tab = initialTab; ui.screen = initialTab; }
  if (params.get('notion') === 'connected') notionUi.message = 'Notion connected. Choose the database that contains your projects.';
  const initialNavigation = captureNavigationState(crypto.randomUUID());
  currentNavigationKey = initialNavigation.key;
  navigationSnapshots.set(initialNavigation.key, initialNavigation);
  history.replaceState({ syncy: true, key: initialNavigation.key, screen: ui.screen, tab: ui.tab, scrollTop: 0 }, '', location.href);
  navigationReady = true;
  render();
  refreshNotionStatus().then(() => render());
}).catch(error => {
  document.getElementById('sideNote').textContent = error.message || 'Check the Supabase URL and public key, then reload.';
  document.getElementById('screen').innerHTML = '<div class="title">Could not connect to Supabase</div><p class="muted">Check your configuration and connection, then reload this page.</p><button class="btn btn-primary" onclick="location.reload()">Retry</button>';
  document.getElementById('tabbar').style.display = 'none';
});
</script>
</body>
</html>
