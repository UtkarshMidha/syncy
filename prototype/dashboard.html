<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<link rel="stylesheet" href="theme.css">
<title>Syncy contacts</title>
<!--
  Contacts dashboard. Reads and writes the same rows as the phone app through data.js,
  which requires an authenticated Supabase session.
-->
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-sans); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 2px; }
.side :focus-visible { outline-color: var(--accent-2); }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
a { touch-action: manipulation; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100dvh; }

/* ---------- sidebar ---------- */
.side { background: var(--sidebar); color: #fff; padding: 26px 16px 18px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100dvh; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; letter-spacing: -.02em; margin: 0 10px 9px; color: #fff; text-decoration: none; }
.logo { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f1ba78, var(--accent-2) 46%, var(--accent) 100%); box-shadow: 0 3px 12px rgba(184, 74, 27, .18); }
.side-tagline { margin: 0 10px 28px; max-width: 205px; color: var(--sidebar-muted); font-size: 12.5px; line-height: 1.45; }
.nav { min-height: 46px; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--sidebar-muted); text-decoration: none; text-align: left; font-size: 13.5px; transition: background-color .16s, color .16s, transform .16s var(--ease-out); }
.nav svg { width: 19px; height: 19px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: hover) and (pointer: fine) { .nav:hover:not(.on) { background: var(--sidebar-hover); color: #fff; } }
.nav.on { background: rgba(255, 255, 255, .1); color: #fff; font-weight: 600; }
.nav.on svg { color: var(--accent-2); }
.nav .count { margin-left: auto; font-size: 12px; color: #98a2b3; }
.side .spacer { flex: 1; min-height: 18px; }

/* ---------- main ---------- */
.main { width: 100%; max-width: 1600px; justify-self: center; padding: 32px clamp(24px, 3.2vw, 48px) 56px; min-width: 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: clamp(27px, 2.3vw, 32px); letter-spacing: -.035em; line-height: 1.2; }
.head p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 14px; border-radius: 10px; font-weight: 600; background: var(--grey-soft); text-decoration: none; color: var(--ink); }
.btn-primary { background: linear-gradient(135deg, var(--accent), #ef7d33); color: #fff; box-shadow: 0 6px 16px rgba(228, 96, 42, .28); position: relative; overflow: hidden; }
.btn-primary::before {
  content: ''; position: absolute; left: 2px; right: 2px; top: 2px; height: 48%; pointer-events: none;
  border-radius: inherit; border-bottom-left-radius: 50% 35%; border-bottom-right-radius: 50% 35%;
  background: linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, .07));
}
.icon-btn { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--grey-soft); flex: none; }
.set-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.set-row span { color: var(--muted); flex: none; }
.set-row b { font-weight: 600; text-align: right; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.6fr); gap: 12px; margin: 20px 0 18px; }
.stat { background: linear-gradient(180deg, #fff 0%, #fdf8f1 100%); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; text-align: left; box-shadow: var(--shadow); transition: transform .18s var(--ease-out), background-color .18s, border-color .18s, box-shadow .18s; }
@media (hover: hover) and (pointer: fine) { button.stat:hover { transform: translateY(-1px); background: var(--card); border-color: var(--line); box-shadow: var(--shadow-raised); } }
.stat.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow); }
.stat .num { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.035em; line-height: 1.1; }
.stat .lbl { color: var(--muted); font-size: 13px; }
.stat.warn .num { color: var(--danger); }
.bars { display: flex; flex-direction: column; gap: 7px; margin-top: 6px; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 12.5px; align-items: center; }
.bar .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--grey-soft); overflow: hidden; }
.bar .fill { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

/* ---------- toolbar ---------- */
.toolbar { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; position: sticky; top: 12px; z-index: 5; box-shadow: var(--shadow); }
.search { flex: 1 1 240px; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; }
.search svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.search input { border: 0; outline: 0; padding: 9px 0; width: 100%; background: transparent; }
.search:focus-within { outline: 2px solid var(--accent-ink); border-color: transparent; }
select.f { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: 13px; background: var(--card); max-width: 180px; }
select.f:focus { outline: 2px solid var(--accent-ink); border-color: transparent; }
select.f.set { border-color: var(--accent); background: var(--accent-soft); }

/* capture status as a progress line, sources as an icon line */
.stepper, .srcline { display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; flex: none; }
.stepper .step, .srcline button { display: inline-flex; align-items: center; gap: 5px; padding: 0 2px; font-size: 12px; font-weight: 600; color: var(--muted); transition: transform 160ms var(--ease-out); }
.stepper .step:active, .srcline button:active { transform: scale(.94); }
.stepper .sdot { width: 8px; height: 8px; border-radius: 50%; background: #d7dde5; flex: none; transition: background .15s, box-shadow .15s; }
.stepper .step.done .sdot, .stepper .step.on .sdot { background: var(--accent); }
.stepper .step.on { color: var(--accent-ink); }
.stepper .step.on .sdot { box-shadow: 0 0 0 3px var(--accent-soft); }
.conn { width: 14px; height: 2px; border-radius: 1px; background: var(--line); margin: 0 5px; flex: none; }
.conn.done { background: var(--accent); }
.srcline .src { width: 20px; height: 20px; border-radius: 6px; font-size: 11px; filter: grayscale(1) opacity(.5); transition: filter .15s, box-shadow .15s; }
.srcline button[aria-pressed="true"] .src { filter: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.more-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.more-toggle .chev { display: inline-block; transition: transform .2s var(--ease-out); }
.more-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.more-toggle.set { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.morefilters { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; align-items: center; }
.morefilters[hidden] { display: none; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; align-items: center; }
.stages .lbl { font-size: 12.5px; color: var(--muted); margin-right: 2px; }
.chipbtn { min-height: 36px; font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); transition: transform .16s var(--ease-out), background-color .16s, border-color .16s, color .16s, box-shadow .16s; }
.chipbtn.on { border-color: currentColor; }
.clear { font-size: 13px; color: var(--accent-ink); font-weight: 600; margin-left: auto; }
.resultline { display: flex; justify-content: space-between; align-items: center; margin: 14px 2px 8px; color: var(--muted); font-size: 13px; }

/* ---------- table ---------- */
.table { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.thead, .row { display: grid; grid-template-columns: minmax(200px, 2.1fr) minmax(220px, 3fr) minmax(120px, 1.2fr) minmax(170px, 1.7fr) minmax(110px, 1fr) minmax(110px, 1fr); gap: 14px; align-items: center; padding: 12px 16px; }
.thead { background: var(--bg); border-bottom: 1px solid var(--line); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.thead button { text-transform: inherit; letter-spacing: inherit; font-weight: inherit; color: inherit; text-align: left; display: inline-flex; gap: 4px; align-items: center; }
.thead button.on { color: var(--ink); }
.row { border-bottom: 1px solid var(--line); cursor: pointer; transition: transform .18s var(--ease-out), background-color .18s, border-color .18s, box-shadow .18s; }
.row:last-child { border-bottom: 0; }
@media (hover: hover) and (pointer: fine) { .row:hover { background: var(--bg); } }
.row:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: -2px; }
.row.open { background: var(--accent-soft); }
.person { display: flex; gap: 10px; align-items: center; min-width: 0; }
.avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; position: relative; overflow: hidden; }
.avatar::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(130% 80% at 30% 15%, rgba(255, 255, 255, .6), rgba(255, 255, 255, .14) 40%, rgba(255, 255, 255, 0) 62%),
    linear-gradient(180deg, rgba(255, 255, 255, .1), rgba(0, 0, 0, .1));
}
.pname { font-weight: 650; display: flex; align-items: center; gap: 6px; }
.prole { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.summary { font-size: 13.5px; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.src { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; color: #fff; font-size: 10px; font-weight: 800; flex: none; }
.src.li { background: var(--linkedin); }
.src.xi { background: var(--xing); }
.src.ot { background: #667085; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--grey-soft); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pill.need-note { background: var(--accent-soft); color: var(--accent-ink); }
.proj-cell .pill { white-space: normal; line-height: 1.3; }
.next { font-size: 13px; }
.next .due { display: block; font-size: 12.5px; color: var(--muted); }
.next .due.overdue { color: var(--danger); font-weight: 600; }
.next .due.soon { color: var(--accent-ink); font-weight: 600; }
.met { font-size: 12.5px; color: var(--muted); }
.met b { color: var(--ink); font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.evlink { color: var(--accent-ink); font-size: 12.5px; text-decoration: none; }
@media (hover: hover) and (pointer: fine) { .evlink:hover { text-decoration: underline; } }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }

.st-to_follow_up { background: var(--accent-soft); color: var(--accent-ink); }
.st-followed_up { background: var(--blue-soft); color: var(--blue); }
.st-meeting_set { background: var(--purple-soft); color: var(--purple); }
.st-won { background: var(--ok-soft); color: var(--ok); }
.st-not_relevant { background: var(--grey-soft); color: var(--muted); }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(23, 26, 33, .28); opacity: 0; pointer-events: none; transition: opacity .3s ease; z-index: 20; }
.scrim.show { opacity: 1; pointer-events: auto; }
.scrim:not(.show) { transition-duration: .2s; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--panel); box-shadow: -6px 0 24px rgba(23, 26, 33, .12); transform: translateX(100%); transition: transform .28s var(--ease-drawer); z-index: 21; display: flex; flex-direction: column; }
.drawer.show { transform: none; }
.drawer:not(.show) { transition-duration: .28s; }
.dhead { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.dhead .avatar { width: 52px; height: 52px; font-size: 18px; }
.dhead .x { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; background: var(--grey-soft); flex: none; font-size: 16px; }
.dhead input.title { font-size: 20px; font-weight: 700; letter-spacing: -.01em; border: 1px solid transparent; border-radius: 8px; padding: 2px 6px; margin-left: -6px; width: 100%; background: transparent; }
.dhead input.title:focus { border-color: var(--accent-ink); background: #fff; }
@media (hover: hover) and (pointer: fine) { .dhead input.title:hover:not(:focus) { border-color: var(--line); background: #fff; } }
.dbody { padding: 6px 20px 30px; overflow-y: auto; flex: 1; }
.label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; display: flex; justify-content: space-between; align-items: center; }
.label .ai { text-transform: none; letter-spacing: 0; color: var(--accent-ink); font-weight: 600; }
.label .ai.user { color: var(--muted); }
.label .label-actions { display: inline-flex; align-items: center; gap: 10px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.match { border: 1px solid var(--line); border-left: 3px solid var(--ai); background: var(--ai-soft); border-radius: var(--radius); padding: 12px 14px; }
.match .reason { margin-top: 8px; font-size: 13.5px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font-size: 12.5px; font-weight: 600; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); }
.seg button:not([aria-pressed="true"]) { background: #fff; color: var(--muted); }
.seg button[aria-pressed="true"] { border-color: transparent; }
.edit { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--card); resize: vertical; }
.edit:focus { outline: 2px solid var(--accent-ink); border-color: transparent; }
.two { display: grid; grid-template-columns: 1fr 150px; gap: 8px; }
.half { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.linkrow { display: flex; align-items: center; gap: 8px; font-size: 13px; background: var(--grey-soft); border-radius: 10px; padding: 8px 10px; }
.linkrow code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copy { font-size: 12.5px; font-weight: 600; color: var(--accent-ink); }
.savebar { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; margin-top: 18px; padding: 12px 0 4px; background: var(--panel); border-top: 1px solid var(--line); }
.savebar .state { margin-right: auto; font-size: 12.5px; color: var(--muted); }
.savebar .state.ok { color: var(--ok); }
.savebar .btn:disabled { opacity: .45; cursor: default; }
.notekind { font-size: 12px; color: var(--muted); }
.meta-grid { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; color: var(--muted); }
.meta-grid code { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- mobile app navigation ---------- */
.mobile-nav { display: none; }
.load-state { min-height: 100dvh; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 24px; color: var(--muted); }
.loader { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: load-spin .8s linear infinite; }
@keyframes load-spin { to { transform: rotate(360deg); } }

/* ---------- responsive ---------- */
@media (max-width: 1328px) {
  .thead { display: none; }
  .table { overflow: visible; border: 0; background: transparent; box-shadow: none; }
  #rows { display: grid; gap: 10px; }
  .row { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
  #rows > .row:last-child { border-bottom: 1px solid var(--line); }
  .row > *, .person > div { min-width: 0; }
  .row .summary, .row .next, .row .met { grid-column: 1 / -1; }
  .row .proj-cell { grid-column: 1; }
  .row .stage-cell { grid-column: 2; grid-row: 1; }
}
@media (max-width: 1328px) and (hover: hover) and (pointer: fine) {
  .row:hover { transform: translateY(-1px); background: var(--card); border-color: var(--accent); box-shadow: var(--shadow-raised); }
}
@media (max-width: 1180px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats .projects { grid-column: 1 / -1; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .main { padding: 18px 16px calc(88px + env(safe-area-inset-bottom, 0px)); }
  .head, .head > div { min-width: 0; }
  .stats > *, .stat { min-width: 0; }
  .stat .lbl, .bar > span:first-child { overflow-wrap: anywhere; }
  select.f { max-width: 100%; min-width: 0; flex: 1 1 140px; }
  .toolbar { position: static; }
  .toolbar input, .toolbar button { min-height: 44px; }
  .toolbar select { min-height: 40px; }
  .stepper, .srcline { height: 44px; flex: 1 1 auto; justify-content: center; }
  .stepper .step, .srcline button { min-height: 0; }
  .toolbar input, .toolbar select, .drawer input, .drawer select, .drawer textarea { font-size: 16px; }
  .chipbtn { min-height: 44px; padding: 8px 12px; }
  .clear { min-height: 44px; padding: 8px; }
  .drawer { bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .two { grid-template-columns: minmax(0, 1fr) minmax(0, .8fr); }
  .half { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .edit { min-width: 0; }
  .dhead .x { width: 44px; height: 44px; }
  .seg button, .copy { min-height: 44px; padding: 10px 12px; }
  /* Keep mobile navigation consistent with the workspace tab bar. */
  .mobile-nav {
    position: fixed; z-index: 10; inset: auto 0 0; display: flex;
    padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
    background: rgba(255, 255, 255, .96); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .mobile-nav a {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; min-height: 52px; padding: 4px 2px; border-radius: 9px;
    color: var(--muted); text-decoration: none; font-size: 11px; line-height: 1.2;
    transition: transform 160ms var(--ease-out), color .15s, background-color .15s;
  }
  .mobile-nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .mobile-nav svg { width: 22px; height: 22px; }
  .mobile-nav a svg { filter: grayscale(1) opacity(.55); transition: filter .15s; }
  .mobile-nav a[aria-current="page"] svg { filter: drop-shadow(0 2px 3px rgba(228, 96, 42, .25)); }
  .mobile-nav .tlbl { transition: opacity .25s var(--ease-out), transform .25s var(--ease-out); }
  .mobile-nav a[aria-current="page"] .tlbl { opacity: 0; transform: translateY(8px); }
}
@media (max-width: 360px) {
  .main { padding-right: 12px; padding-left: 12px; }
  .two, .half { grid-template-columns: 1fr; }
}
/* ---------- restrained interaction feedback ---------- */
.btn, .nav, .chipbtn, .seg button, .dhead .x, .mobile-nav a, .icon-btn, .more-toggle { transition: background-color .16s, color .16s, border-color .16s, transform .16s var(--ease-out), box-shadow .16s; }
.btn:active:not(:disabled), .nav:active, .chipbtn:active, .seg button:active, .dhead .x:active, .mobile-nav a:active, .icon-btn:active, .more-toggle:active { transform: scale(.98); }
button.stat:active { transform: scale(.97) rotate(-1.6deg); }
button.stat:nth-child(even):active { transform: scale(.97) rotate(1.6deg); }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-1.2deg); } 55% { transform: rotate(1.2deg); } 80% { transform: rotate(-.5deg); } }
/* phones never fire :hover, so the wiggle plays on press there; JS pairs it with a short vibration */
@media (hover: none) {
  .btn:active:not(:disabled), .chipbtn:active, .seg button:active, .dhead .x:active, .mobile-nav a:active,
  .icon-btn:active, .more-toggle:active, .stepper .step:active, .srcline button:active { animation: wiggle .35s var(--ease-out); }
}
@media (hover: hover) and (pointer: fine) {
  .btn:hover:not(:disabled), .chipbtn:not(.on):hover, .seg button:hover:not([aria-pressed="true"]), .dhead .x:hover, .mobile-nav a:hover, .icon-btn:hover, .more-toggle:hover, .stepper .step:hover, .srcline button:hover { background-color: var(--grey-soft); }
  .btn:hover:not(:disabled), .nav:hover, .chipbtn:hover, .seg button:hover, button.stat:hover,
  .copy:hover, .clear:hover, .dhead .x:hover, .mobile-nav a:hover, .icon-btn:hover, .more-toggle:hover,
  .stepper .step:hover, .srcline button:hover { animation: wiggle .4s var(--ease-out); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
}

/* ---------- toasts (Sonner-style: transitions, not keyframes) ---------- */
.toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 80; pointer-events: none; }
@media (max-width: 900px) { .toasts { left: 14px; right: 14px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); align-items: center; } }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 8px; max-width: 380px; background: var(--sidebar); color: #fff; font-size: 13.5px; font-weight: 500; line-height: 1.4; padding: 11px 16px; border-radius: var(--radius); box-shadow: var(--shadow-raised); transition: transform .35s var(--ease-out), opacity .35s var(--ease-out); }
.toast::before { font-weight: 800; flex: none; }
.toast.success::before { content: '✓'; color: var(--ok-on-dark); }
.toast.error::before { content: '!'; color: #e6ad9d; }
.toast[data-state="pre"] { opacity: 0; transform: translateY(12px) scale(.97); }
.toast[data-state="out"] { opacity: 0; transform: translateY(6px) scale(.98); transition-duration: .2s; }

/* ---------- confirm dialog (replaces confirm(); modal, so it scales from center) ---------- */
.dialog-wrap { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; }
.dialog-wrap .dscrim { position: absolute; inset: 0; background: rgba(23, 26, 33, .42); opacity: 0; transition: opacity .25s ease; }
.dialog { position: relative; width: min(400px, 100%); background: var(--panel); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-raised); opacity: 0; transform: scale(.98); transition: transform .18s var(--ease-out), opacity .18s var(--ease-out); }
.dialog-wrap.open .dscrim { opacity: 1; }
.dialog-wrap.open .dialog { opacity: 1; transform: none; }
.dialog-wrap:not(.open) .dialog, .dialog-wrap:not(.open) .dscrim { transition-duration: .15s; }
.dialog h3 { margin: 0 0 6px; font-size: 16px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.dialog p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.dialog .dactions { display: flex; gap: 8px; justify-content: flex-end; }
.btn-danger { background: var(--danger); color: #fff; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script>
const STAGES = [
  { id: 'to_follow_up', label: 'To follow up' },
  { id: 'followed_up', label: 'Followed up' },
  { id: 'meeting_set', label: 'Meeting set' },
  { id: 'won', label: 'Won' },
  { id: 'not_relevant', label: 'Not relevant' },
];
const SOURCE_LABEL = { qr_linkedin: 'LinkedIn', qr_xing: 'Xing', qr_other: 'Profile link', manual: 'Manual' };
const CAPTURE_STEPS = [['captured', 'Needs a note'], ['review', 'In review'], ['saved', 'Saved']];
const SRC_OPTS = [['qr_linkedin', 'li', 'in', 'LinkedIn'], ['qr_xing', 'xi', 'X', 'Xing'], ['qr_other', 'ot', '↗', 'Other link']];
const COLORS = ['var(--avatar-rust)', 'var(--avatar-forest)', 'var(--avatar-blue)', 'var(--avatar-violet)', 'var(--avatar-teal)', 'var(--avatar-ochre)', 'var(--avatar-steel)', 'var(--avatar-slate)'];

const state = {
  q: '', project: 'all', event: 'all', due: 'all', status: 'all', source: 'all', more: false,
  stages: new Set(STAGES.map(s => s.id)),
  sort: 'due', openId: null, statFilter: null,
  draft: {}, // unsaved edits for the open contact; written to the db only on Save
};

// ---------- data ----------
const contacts = () => db.list('contacts');
const projects = () => db.list('projects').filter(p => !p.archived);
const events = () => db.list('events').sort((a, b) => b.starts_on.localeCompare(a.starts_on));
const proj = id => id && db.get('projects', id);
const event = id => id && db.get('events', id);

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stage = id => STAGES.find(s => s.id === id);
function initials(n) { return (n || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase(); }
function color(n) { let h = 0; for (const c of n || '?') h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const avatar = n => `<span class="avatar" style="background:${color(n)}">${esc(initials(n))}</span>`;
// With a url, the badge links to the profile (clicks don't bubble into the row).
function srcBadge(s, url) {
  const cls = s === 'qr_xing' ? 'src xi' : s === 'qr_linkedin' ? 'src li' : 'src ot';
  const title = s === 'qr_xing' ? 'Xing' : s === 'qr_linkedin' ? 'LinkedIn' : 'Profile link';
  const label = s === 'qr_xing' ? 'X' : s === 'qr_linkedin' ? 'in' : '↗';
  const href = url && normalizeUrl(url);
  if (!href) return `<span class="${cls}" title="${title}">${label}</span>`;
  return `<a class="${cls}" style="text-decoration:none" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="Open ${title}" onclick="event.stopPropagation()">${label}</a>`;
}
function initials2(n) { return (String(n || '?').replace(/[^\p{L}\p{N}]/gu, '').slice(0, 2) || '?').toUpperCase(); }
function projTag(p) { return `<span class="src" style="border-radius:5px;background:${color(p.name)}" title="${esc(p.name)}">${esc(initials2(p.name))}</span>`; }
function days(iso) { return Math.round((Date.parse(iso) - Date.parse(db.TODAY)) / 86400000); }
function fmt(iso) { return new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
const isOpen = c => c.stage === 'to_follow_up' || c.stage === 'followed_up';
const isOverdue = c => c.next_step_date && days(c.next_step_date) < 0 && isOpen(c);
const isThisWeek = c => c.next_step_date && days(c.next_step_date) >= 0 && days(c.next_step_date) <= 7 && c.stage !== 'won' && c.stage !== 'not_relevant';
const needsNote = c => c.status === 'captured';

function dueLabel(c) {
  if (!c.next_step_date) return '<span class="due">No date</span>';
  const d = days(c.next_step_date);
  if (isOverdue(c)) return `<span class="due overdue">Overdue · ${fmt(c.next_step_date)}</span>`;
  if (d === 0) return `<span class="due soon">Today</span>`;
  if (d === 1) return `<span class="due soon">Tomorrow</span>`;
  if (isThisWeek(c)) return `<span class="due soon">${fmt(c.next_step_date)} · in ${d} days</span>`;
  return `<span class="due">${fmt(c.next_step_date)}</span>`;
}

// ---------- filtering & sorting ----------
function filtered() {
  const q = state.q.trim().toLowerCase();
  return contacts().filter(c => {
    if (q && ![c.name, c.role, c.company, c.summary, c.needs, c.next_step, c.note_text, c.user_notes, c.profile_url].join(' ').toLowerCase().includes(q)) return false;
    if (state.project !== 'all' && (state.project === 'none' ? c.project_id : c.project_id !== state.project)) return false;
    if (state.event !== 'all' && c.event_id !== state.event) return false;
    if (state.source !== 'all' && c.source !== state.source) return false;
    if (state.status !== 'all' && c.status !== state.status) return false;
    if (!state.stages.has(c.stage)) return false;
    if (state.due === 'overdue' && !isOverdue(c)) return false;
    if (state.due === 'week' && !isThisWeek(c)) return false;
    if (state.due === 'later' && !(c.next_step_date && days(c.next_step_date) > 7)) return false;
    if (state.due === 'none' && c.next_step_date) return false;
    return true;
  }).sort(SORTS[state.sort]);
}

const stageRank = id => STAGES.findIndex(s => s.id === id);
const projName = c => proj(c.project_id)?.name || '~';
const SORTS = {
  // Contacts that still need a note first, then open follow-ups by date, undated after, closed ones last.
  due: (a, b) => (needsNote(b) - needsNote(a)) || (isOpen(b) - isOpen(a)) || ((a.next_step_date ? 0 : 1) - (b.next_step_date ? 0 : 1)) || String(a.next_step_date).localeCompare(String(b.next_step_date)),
  met: (a, b) => b.scanned_at.localeCompare(a.scanned_at),
  name: (a, b) => (a.name || '').localeCompare(b.name || ''),
  project: (a, b) => projName(a).localeCompare(projName(b)) || (a.name || '').localeCompare(b.name || ''),
  stage: (a, b) => stageRank(a.stage) - stageRank(b.stage) || (a.name || '').localeCompare(b.name || ''),
};

// ---------- rendering ----------
function renderStats() {
  const all = contacts();
  const overdue = all.filter(isOverdue).length;
  const week = all.filter(isThisWeek).length;
  const pending = all.filter(needsNote).length;
  const max = Math.max(1, ...projects().map(p => all.filter(c => c.project_id === p.id).length));
  const statBtn = (key, num, lbl, cls = '') =>
    `<button class="stat ${cls} ${state.statFilter === key ? 'active' : ''}" onclick="statClick('${key}')"><div class="num">${num}</div><div class="lbl">${lbl}</div></button>`;
  document.getElementById('stats').innerHTML =
    statBtn('all', all.length, `contacts from ${events().length} events`) +
    statBtn('week', week, 'follow-ups due in the next 7 days') +
    statBtn('overdue', overdue, 'overdue follow-ups', overdue ? 'warn' : '') +
    statBtn('pending', pending, 'scanned, still need a note') +
    `<div class="stat projects"><div class="lbl">Contacts per project</div><div class="bars">${projects().map(p => {
      const n = all.filter(c => c.project_id === p.id).length;
      return `<div class="bar"><span>${projTag(p)} ${esc(p.name)}</span><b>${n}</b><span class="track"><span class="fill" style="width:${n / max * 100}%"></span></span></div>`;
    }).join('')}</div></div>`;
  document.getElementById('navCount').textContent = all.length;
  document.getElementById('subline').textContent = `${all.filter(c => isOpen(c) && !needsNote(c)).length} open follow-ups · ${pending} waiting for a note`;
}

function renderFilters() {
  const all = contacts();
  const fp = document.getElementById('fProject');
  fp.innerHTML = `<option value="all">All projects</option>` +
    projects().map(p => `<option value="${p.id}">${esc(p.name)} (${all.filter(c => c.project_id === p.id).length})</option>`).join('') +
    `<option value="none">No project (${all.filter(c => !c.project_id).length})</option>`;
  const fe = document.getElementById('fEvent');
  fe.innerHTML = `<option value="all">All events</option>` +
    events().map(e => `<option value="${e.id}">${esc(e.name)} · ${fmt(e.starts_on)}</option>`).join('');
  if (![...fp.options].some(o => o.value === state.project)) state.project = 'all';
  if (![...fe.options].some(o => o.value === state.event)) state.event = 'all';
  fp.value = state.project; fe.value = state.event;
  document.getElementById('fDue').value = state.due;
  document.getElementById('sortSel').value = state.sort;
  ['fProject', 'fEvent', 'fDue'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.toggle('set', el.value !== 'all');
  });
  // Capture status drawn as a progress line: dots fill up to the selected step.
  const stepIdx = CAPTURE_STEPS.findIndex(([id]) => id === state.status);
  document.getElementById('fStatus').innerHTML = CAPTURE_STEPS.map(([id, label], i) =>
    `${i ? `<span class="conn ${stepIdx >= 0 && i <= stepIdx ? 'done' : ''}" aria-hidden="true"></span>` : ''}` +
    `<button type="button" class="step ${i === stepIdx ? 'on' : ''} ${stepIdx >= 0 && i < stepIdx ? 'done' : ''}" aria-pressed="${i === stepIdx}" onclick="setStatus('${id}')"><span class="sdot" aria-hidden="true"></span>${label}</button>`).join('');
  // Sources as icons on the same kind of line.
  document.getElementById('fSource').innerHTML = SRC_OPTS.map(([id, cls, glyph, label], i) =>
    `${i ? '<span class="conn" aria-hidden="true"></span>' : ''}` +
    `<button type="button" aria-pressed="${state.source === id}" title="${label}" aria-label="${label}" onclick="setSource('${id}')"><span class="src ${cls}">${glyph}</span></button>`).join('');
  // The extra filters live under "More"; the button shows when a hidden one is active.
  document.getElementById('moreFilters').hidden = !state.more;
  const moreBtn = document.getElementById('moreBtn');
  moreBtn.setAttribute('aria-expanded', String(!!state.more));
  moreBtn.classList.toggle('set', !state.more && (state.status !== 'all' || state.source !== 'all' || state.stages.size !== STAGES.length));
  document.getElementById('stageChips').innerHTML = `<span class="lbl">Stage:</span>` + STAGES.map(s => {
    const on = state.stages.has(s.id);
    const n = all.filter(c => c.stage === s.id).length;
    return `<button class="chipbtn ${on ? 'on st-' + s.id : ''}" aria-pressed="${on}" onclick="toggleStage('${s.id}')">${on ? '✓ ' : ''}${s.label} · ${n}</button>`;
  }).join('');
}

const COLS = [['name', 'Person'], [null, 'Summary'], ['project', 'Project'], ['due', 'Next step'], ['stage', 'Stage'], ['met', 'Met at']];
function renderRows() {
  document.getElementById('thead').innerHTML = COLS.map(([key, label]) => key
    ? `<button class="${state.sort === key ? 'on' : ''}" onclick="setSort('${key}')">${label}${state.sort === key ? ' ↓' : ''}</button>`
    : `<span>${label}</span>`).join('');
  const list = filtered();
  const total = contacts().length;
  document.getElementById('resultCount').textContent = list.length === total ? `Showing all ${total} contacts` : `Showing ${list.length} of ${total} contacts`;
  document.getElementById('clearBtn').style.visibility = isFiltered() ? 'visible' : 'hidden';
  document.getElementById('rows').innerHTML = list.length ? list.map(c => {
    const p = proj(c.project_id), s = stage(c.stage), e = event(c.event_id);
    const who = [c.role, c.company].filter(Boolean).join(' · ') || c.profile_url;
    return `<div class="row ${state.openId === c.id ? 'open' : ''}" data-contact-id="${esc(c.id)}" role="row" tabindex="0" aria-label="Open contact details for ${esc(c.name || c.profile_slug)}" onclick="openDrawer('${c.id}')" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();openDrawer('${c.id}')}">
      <div class="person">${avatar(c.name)}<div style="min-width:0"><div class="pname">${esc(c.name || c.profile_slug)} ${srcBadge(c.source, c.profile_url)}</div><div class="prole">${esc(who)}</div></div></div>
      <div class="summary">${needsNote(c) ? '<span class="pill need-note">Scanned · needs a note</span>' : esc(c.summary)}</div>
      <div class="proj-cell">${p ? `<span class="pill" title="${esc(p.name)}">${projTag(p)} ${esc(p.name.split(':')[0])}</span>` : '<span class="pill">No project</span>'}</div>
      <div class="next">${esc(c.next_step || '—')}${dueLabel(c)}</div>
      <div class="stage-cell"><span class="pill st-${s.id}">${s.label}</span></div>
      <div class="met"><b>${esc(e?.name || 'No event')}</b>${e ? fmt(e.starts_on) : ''}${e?.url ? ` · <a class="evlink" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="Event page: ${esc(urlHost(e.url))}" aria-label="Event page">↗</a>` : ''}</div>
    </div>`;
  }).join('') : `<div class="empty">No contacts match these filters. <button class="clear" onclick="clearFilters()">Clear filters</button></div>`;
}

function renderDrawer() {
  const dr = document.getElementById('drawer');
  const c = state.openId && db.get('contacts', state.openId);
  document.getElementById('scrim').classList.toggle('show', !!c);
  dr.classList.toggle('show', !!c);
  dr.setAttribute('aria-hidden', String(!c));
  if (!c) return;
  const d = { ...c, ...state.draft };
  const e = event(c.event_id);
  const input = (field, ph = '—') => `<input class="edit" value="${esc(d[field])}" placeholder="${ph}" oninput="edit('${field}', this.value)">`;
  dr.innerHTML = `
    <div class="dhead">${avatar(d.name)}
      <div style="min-width:0;flex:1"><input class="title" value="${esc(d.name)}" aria-label="Name" oninput="edit('name', this.value)">
        <div class="prole">${esc(SOURCE_LABEL[c.source])} · met at ${esc(e?.name || 'no event')}${e ? ' · ' + fmt(e.starts_on) : ''}</div>
        ${e?.url ? `<a class="evlink" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(urlHost(e.url))} ↗</a>` : ''}</div>
      <button class="x" onclick="closeDrawer()" aria-label="Close">✕</button></div>
    <div class="dbody">
      ${needsNote(c) ? `<div class="box" style="margin-top:14px;background:var(--accent-soft);border-color:transparent">Scanned, but no note yet. Add one in the <a href="index.html">main app</a>, or fill the fields here.</div>` : ''}

      <div class="label">Stage</div>
      <div class="seg">${STAGES.map(s => `<button class="${d.stage === s.id ? 'st-' + s.id : ''}" aria-pressed="${d.stage === s.id}" onclick="edit('stage','${s.id}')">${s.label}</button>`).join('')}</div>

      <div class="half" style="margin-top:4px">
        <div><div class="label">Role</div>${input('role')}</div>
        <div><div class="label">Company</div>${input('company')}</div>
      </div>

      <div class="label">Project ${d.project_set_by === 'ai' ? '<span class="ai">AI suggested</span>' : d.project_set_by === 'user' ? '<span class="ai" style="color:var(--muted)">set by you</span>' : ''}</div>
      <div class="match">
        <select class="edit" onchange="assignProject(this.value)">
          ${projects().map(p => `<option value="${p.id}" ${p.id === d.project_id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
          <option value="" ${!d.project_id ? 'selected' : ''}>No project</option>
        </select>
        ${d.match_reason ? `<div class="reason">${esc(d.match_reason)}</div>` : ''}
      </div>

      <div class="label">Summary <span class="ai${d.summary_edited_by_user ? ' user' : ''}" id="summarySource">${d.summary_edited_by_user ? 'Suggested by you' : 'AI · editable'}</span></div>
      <textarea class="edit" rows="2" oninput="edit('summary', this.value)">${esc(d.summary)}</textarea>

      <div class="label">What you talked about <span class="ai" style="color:var(--muted)">one per line, max 3</span></div>
      <textarea class="edit" rows="3" oninput="edit('discussed', this.value.split('\\n').map(s=>s.trim()).filter(Boolean).slice(0,3))">${esc((d.discussed || []).join('\n'))}</textarea>

      <div class="label">Next step</div>
      <div class="two">${input('next_step')}
        <input class="edit" type="date" value="${d.next_step_date || ''}" onchange="edit('next_step_date', this.value || null)" aria-label="Due date"></div>

      <div class="label">Follow-up draft <span class="label-actions">${srcBadge(c.source, c.profile_url)}<button class="copy" onclick="copyDraft(this)">Copy</button></span></div>
      <textarea class="edit" rows="4" oninput="edit('follow_up_draft', this.value)">${esc(d.follow_up_draft)}</textarea>

      <div class="label">Your notes</div>
      <textarea class="edit" rows="3" placeholder="Anything to remember…" oninput="edit('user_notes', this.value)">${esc(d.user_notes)}</textarea>

      ${c.note_text ? `<div class="label">Original note <span class="notekind">${c.note_kind === 'voice' ? 'Voice transcript' : 'Typed'}</span></div><div class="box" style="font-size:13.5px">${esc(c.note_text)}</div>` : ''}

      <div class="label">Profile</div>
      <div class="linkrow">${srcBadge(c.source)}<code>${esc(c.profile_url)}</code></div>
      <div class="label">Row</div>
      <div class="meta-grid"><span>status</span><code>${esc(c.status)}</code><span>profile_slug</span><code>${esc(c.profile_slug)}</code><span>scanned_at</span><code>${esc(c.scanned_at)}</code><span>updated_at</span><code>${esc(c.updated_at)}</code></div>
      <button class="btn" style="margin-top:12px;color:var(--danger)" onclick="deleteContact('${c.id}', this)">Delete contact</button>
      <div class="savebar">
        <span class="state" id="saveState">${dirty() ? 'Unsaved changes' : ''}</span>
        <button class="btn" id="discardBtn" onclick="discardDraft()" ${dirty() ? '' : 'disabled'}>Discard</button>
        <button class="btn btn-primary" id="saveBtn" onclick="saveDraft()" ${dirty() ? '' : 'disabled'}>Save changes</button>
      </div>
    </div>`;
}

function renderAll() { renderStats(); renderFilters(); renderRows(); renderDrawer(); }

// ---------- toast + confirm dialog (replace alert()/confirm()) ----------
function toast(message, opts = {}) {
  let host = document.getElementById('toasts');
  if (!host) { host = document.createElement('div'); host.id = 'toasts'; host.className = 'toasts'; host.setAttribute('aria-live', 'polite'); document.body.appendChild(host); }
  while (host.children.length >= 3) host.firstChild.remove();
  const el = document.createElement('div');
  el.className = `toast ${opts.type || ''}`.trim();
  el.setAttribute('role', 'status');
  el.textContent = message;
  el.dataset.state = 'pre';
  host.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => { delete el.dataset.state; }));
  const hide = () => {
    if (el.dataset.state === 'out') return;
    el.dataset.state = 'out';
    el.addEventListener('transitionend', () => el.remove(), { once: true });
    setTimeout(() => el.remove(), 350);
  };
  setTimeout(hide, opts.duration || (opts.type === 'error' ? 5000 : 3000));
  el.addEventListener('click', hide);
}
function confirmDialog({ title, message, confirmLabel = 'Confirm', cancelLabel = 'Cancel', danger = false }) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'dialog-wrap';
    wrap.innerHTML = `<div class="dscrim"></div>
      <div class="dialog" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
        <h3>${esc(title)}</h3>${message ? `<p>${esc(message)}</p>` : ''}
        <div class="dactions">
          <button class="btn" data-act="no">${esc(cancelLabel)}</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-act="yes">${esc(confirmLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    const done = result => {
      document.removeEventListener('keydown', onKey, true);
      wrap.classList.remove('open');
      wrap.querySelector('.dialog').addEventListener('transitionend', () => wrap.remove(), { once: true });
      setTimeout(() => wrap.remove(), 300);
      resolve(result);
    };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', onKey, true);
    wrap.querySelector('.dscrim').addEventListener('click', () => done(false));
    wrap.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => done(b.dataset.act === 'yes')));
    requestAnimationFrame(() => requestAnimationFrame(() => {
      wrap.classList.add('open');
      wrap.querySelector('[data-act="no"]').focus();
    }));
  });
}

// ---------- actions ----------
function isFiltered() {
  return state.q || state.project !== 'all' || state.event !== 'all' || state.due !== 'all' || state.status !== 'all' || state.source !== 'all' || state.stages.size !== STAGES.length;
}
function clearFilters() {
  Object.assign(state, { q: '', project: 'all', event: 'all', due: 'all', status: 'all', source: 'all', statFilter: null });
  state.stages = new Set(STAGES.map(s => s.id));
  document.getElementById('q').value = '';
  renderAll();
}
function statClick(key) {
  const wasOn = state.statFilter === key;
  clearFilters();
  if (wasOn || key === 'all') return;
  state.statFilter = key;
  if (key === 'week') { state.due = 'week'; state.sort = 'due'; }
  if (key === 'overdue') { state.due = 'overdue'; state.sort = 'due'; }
  if (key === 'pending') state.status = 'captured';
  renderAll();
}
function toggleStage(id) {
  // First click on a chip while all are on narrows to just that stage.
  if (state.stages.size === STAGES.length) state.stages = new Set([id]);
  else if (state.stages.has(id)) state.stages.delete(id);
  else state.stages.add(id);
  if (state.stages.size === 0) state.stages = new Set(STAGES.map(s => s.id));
  state.statFilter = null;
  renderAll();
}
function setSort(key) { state.sort = key; renderAll(); }
// Clicking the selected step or icon again clears that filter.
function setStatus(id) { state.status = state.status === id ? 'all' : id; state.statFilter = null; renderAll(); }
function setSource(id) { state.source = state.source === id ? 'all' : id; state.statFilter = null; renderAll(); }
function toggleMore() { state.more = !state.more; renderFilters(); }

async function signOut() { if (!db.live) { location.reload(); return; } try { await db.signOut(); } catch (error) { toast(`Could not sign out: ${error.message}`, { type: 'error' }); } }
// touch feedback: short vibration on taps (Android; iOS Safari has no vibrate API)
const haptic = (ms = 8) => { try { navigator.vibrate?.(ms); } catch {} };
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' && e.target.closest('button, a, summary, [role="button"]')) haptic(8);
}, { passive: true, capture: true });
function openSettings() {
  const wrap = document.createElement('div');
  wrap.className = 'dialog-wrap';
  wrap.innerHTML = `<div class="dscrim"></div>
    <div class="dialog" role="dialog" aria-modal="true" aria-label="Settings">
      <h3>Settings</h3>
      <div class="set-row"><span>Account</span><b>${db.live ? esc(db.user?.email || 'Signed in') : 'Not connected'}</b></div>
      <div class="set-row"><span>Voice memos</span><b>Transcribed only, audio never stored</b></div>
      <div class="set-row"><span>Version</span><b>v. 1.0.0</b></div>
      <div class="dactions" style="margin-top:18px">
        ${db.live ? '' : '<button class="btn" data-act="reset">Reset demo data</button>'}
        <button class="btn" data-act="close">Close</button>
        <button class="btn btn-danger" data-act="signout">Sign out</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const done = () => { document.removeEventListener('keydown', onKey, true); wrap.classList.remove('open'); setTimeout(() => wrap.remove(), 200); };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(); } };
  document.addEventListener('keydown', onKey, true);
  wrap.querySelector('.dscrim').addEventListener('click', done);
  wrap.querySelector('[data-act="close"]').addEventListener('click', done);
  wrap.querySelector('[data-act="reset"]')?.addEventListener('click', () => { localStorage.clear(); location.reload(); });
  wrap.querySelector('[data-act="signout"]').addEventListener('click', async () => { done(); await signOut(); });
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
}
const discardPrompt = () => confirmDialog({
  title: 'Discard unsaved changes?',
  message: 'Your edits to this contact have not been saved and will be lost.',
  confirmLabel: 'Discard changes', cancelLabel: 'Keep editing', danger: true,
});
async function openDrawer(id) {
  if (id !== state.openId && dirty() && !(await discardPrompt())) return;
  if (id !== state.openId) state.draft = {};
  state.openId = id; renderRows(); renderDrawer();
  document.querySelector('#drawer .dhead .x')?.focus();
}
async function closeDrawer() {
  if (dirty() && !(await discardPrompt())) return;
  const previousId = state.openId;
  state.draft = {}; state.openId = null; renderRows(); renderDrawer();
  document.querySelector(`.row[data-contact-id="${previousId}"]`)?.focus();
}

async function deleteContact(id, button) {
  const contact = db.get('contacts', id);
  if (!contact) return;
  const ok = await confirmDialog({
    title: `Delete ${contact.name || 'this contact'}?`,
    message: 'The note and recording are deleted too. This cannot be undone.',
    confirmLabel: 'Delete contact', cancelLabel: 'Keep contact', danger: true,
  });
  if (!ok) return;
  button.disabled = true; button.textContent = 'Deleting…';
  try {
    const result = await db.deleteContact(id);
    state.openId = null;
    renderAll();
    toast('Contact deleted', { type: 'success' });
    if (!result.audioRemoved) toast('The audio file could not be removed from Storage.', { type: 'error' });
  } catch (error) {
    button.disabled = false; button.textContent = 'Delete contact';
    toast(`Could not delete contact: ${error.message || error}`, { type: 'error' });
  }
}

// Edits collect in state.draft; nothing is written until the user presses Save.
const dirty = () => Object.keys(state.draft).length > 0;
function markDirty() {
  const note = document.getElementById('saveState');
  if (note) note.textContent = dirty() ? 'Unsaved changes' : '';
  for (const id of ['saveBtn', 'discardBtn']) { const b = document.getElementById(id); if (b) b.disabled = !dirty(); }
}
function edit(field, value) {
  state.draft[field] = value === '' ? null : value;
  if (field === 'summary') {
    state.draft.summary_edited_by_user = true;
    const source = document.getElementById('summarySource');
    if (source) { source.textContent = 'Suggested by you'; source.classList.add('user'); }
  }
  // Text edits keep the drawer as is, so tabbing to the next field keeps focus.
  if (field === 'stage') renderDrawer(); else markDirty();
}
function assignProject(id) {
  const p = id && db.get('projects', id);
  Object.assign(state.draft, {
    project_id: id || null, project_set_by: 'user', match_confidence: null,
    match_reason: p ? `Assigned by you to “${p.name}”.` : 'Not linked to a project.',
  });
  renderDrawer();
}
// One PATCH on the contacts row, same shape as the phone app writes.
function saveDraft() {
  if (!state.openId || !dirty()) return;
  db.update('contacts', state.openId, state.draft);
  state.draft = {};
  renderAll();
  toast('Changes saved', { type: 'success' });
}
function discardDraft() { state.draft = {}; renderDrawer(); }
function copyDraft(btn) {
  navigator.clipboard?.writeText(state.draft.follow_up_draft ?? db.get('contacts', state.openId).follow_up_draft ?? '').catch(() => {});
  btn.textContent = 'Copied ✓';
  setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
}
// A Claude-style greeting instead of a static page title.
(function setGreeting() {
  const h = new Date().getHours();
  const timed = h < 5 ? 'Up late? 🌙' : h < 12 ? 'Good morning ☀️' : h < 18 ? 'Good afternoon 👋' : 'Good evening 🌆';
  const playful = ['How is it going?', 'Welcome back 👋', 'Nice to see you again', 'Ready to follow up?', 'Who did you meet today?'];
  document.getElementById('pageTitle').textContent = Math.random() < 0.5 ? timed : playful[Math.floor(Math.random() * playful.length)];
})();
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; state.statFilter = null; renderRows(); document.getElementById('clearBtn').style.visibility = isFiltered() ? 'visible' : 'hidden'; });
[['fProject', 'project'], ['fEvent', 'event'], ['fDue', 'due'], ['sortSel', 'sort']].forEach(([id, key]) =>
  document.getElementById(id).addEventListener('change', e => { state[key] = e.target.value; if (key !== 'sort') state.statFilter = null; renderAll(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.openId) closeDrawer(); });
// The phone app saved something in another tab.
window.addEventListener('db-change', () => { if (state.openId && !db.get('contacts', state.openId)) state.openId = null; renderAll(); });
window.addEventListener('db-error', e => toast(`Could not sync with Supabase: ${e.detail}`, { type: 'error' }));
window.addEventListener('auth-change', () => location.replace('login.html?next=dashboard.html'));
db.init().then(authenticated => {
  if (!authenticated) { location.replace('login.html?next=dashboard.html'); return; }
  document.getElementById('loadState').remove();
  document.querySelector('.app').style.visibility = 'visible';
  renderAll();
}).catch(() => {
  document.getElementById('loadState').remove();
  const app = document.querySelector('.app');
  app.innerHTML = '<main class="main"><h1>Could not connect to Supabase</h1><p>Check your configuration and connection, then reload.</p><button class="btn" onclick="location.reload()">Retry</button></main>';
  app.style.visibility = 'visible';
});
</script>
