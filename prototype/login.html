<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <title>Sign in · Syncy</title>
  <style>
    :root { color-scheme:light; --bg:#f4f6f8; --panel:#fff; --ink:#171a21; --muted:#667085; --line:#e3e7ee; --accent:#e4602a; --accent-cta:#c2410c; --accent-hover:#a8431a; --accent-ink:#a8431a; --accent-2:#f3a33f; --grey-soft:#eef1f5; --danger:#c2372b; --shadow:0 1px 2px rgba(23,26,33,.05),0 8px 22px rgba(23,26,33,.07); }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif }
    .card { width:min(100%,440px); padding:30px; background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow) }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:26px; font-weight:750; font-size:20px }
    .logo { width:18px; height:18px; border-radius:50%; background:var(--accent-2) }
    h1 { margin:0; font-size:27px; letter-spacing:-.03em }
    .sub { margin:7px 0 22px; color:var(--muted) }
    label { display:block; margin:14px 0 6px; font-size:13px; font-weight:650 }
    input { width:100%; min-height:48px; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:white; color:var(--ink); font:inherit }
    input:focus { border-color:var(--accent) }
    :focus-visible { outline:3px solid var(--accent-ink); outline-offset:2px }
    button { width:100%; min-height:48px; padding:11px 14px; border:0; border-radius:10px; background:var(--grey-soft); color:var(--ink); font:inherit; font-weight:650; cursor:pointer; transition:background-color .15s,color .15s }
    button:hover:not(:disabled) { background:var(--grey-soft) }
    button:disabled { opacity:.6; cursor:wait }
    .primary { margin-top:18px; background:var(--accent-cta); color:white }
    .primary:hover:not(:disabled) { background:var(--accent-hover) }
    .google { margin-top:12px; background:white; border:1px solid var(--line) }
    .google:hover:not(:disabled) { background:var(--bg) }
    .links { display:flex; justify-content:space-between; gap:12px; margin-top:14px }
    .link { width:auto; min-height:44px; padding:8px 0; background:none; color:var(--accent-ink); font-size:13px }
    .status { min-height:24px; margin:12px 0 0; color:var(--muted); font-size:13px; overflow-wrap:anywhere }
    .status.error { color:var(--danger) }
    .divider { display:flex; align-items:center; gap:12px; margin:16px 0 2px; color:var(--muted); font-size:12px }
    .divider:before,.divider:after { content:""; height:1px; flex:1; background:var(--line) }
    [hidden] { display:none !important }
    @media(max-width:480px) {
      body { place-items:start center; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)) }
      .card { padding:23px 20px; margin-block:auto }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="logo"></span>Syncy</div>
    <h1 id="title">Sign in</h1>
    <p class="sub" id="subtitle">Sign in to see your contacts and projects.</p>
    <form id="authForm">
      <div id="emailGroup"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
      <div id="passwordGroup"><label for="password" id="passwordLabel">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required></div>
      <div id="confirmGroup" hidden><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8"></div>
      <button class="primary" id="submitButton" type="submit">Sign in</button>
    </form>
    <div id="socialActions">
      <div class="divider">or</div>
      <button class="google" id="googleButton" type="button">Continue with Google</button>
    </div>
    <div class="links" id="links">
      <button class="link" id="modeButton" type="button">Create account</button>
      <button class="link" id="forgotButton" type="button">Forgot password?</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const nextPage = ['index.html', 'dashboard.html'].includes(params.get('next')) ? params.get('next') : 'index.html';
    const recovery = params.get('mode') === 'recovery';
    let mode = recovery ? 'recovery' : 'signin';
    const status = document.getElementById('status');
    const setStatus = (message, error = false) => { status.textContent = message; status.classList.toggle('error', error); };
    const callbackUrl = mode => {
      const url = new URL('login.html', location.origin);
      url.searchParams.set('next', nextPage);
      if (mode) url.searchParams.set('mode', mode);
      return url.href;
    };
    function showMode() {
      const forgot = mode === 'forgot', isRecovery = mode === 'recovery', signup = mode === 'signup';
      document.getElementById('title').textContent = isRecovery ? 'Choose a new password' : forgot ? 'Reset password' : signup ? 'Create account' : 'Sign in';
      document.getElementById('subtitle').textContent = isRecovery ? 'Choose a new password for your account.' : forgot ? 'We’ll email you a password reset link.' : signup ? 'Create an account to keep your contacts private.' : 'Sign in to see your contacts and projects.';
      document.getElementById('emailGroup').hidden = isRecovery;
      document.getElementById('passwordGroup').hidden = forgot;
      document.getElementById('passwordLabel').textContent = isRecovery ? 'New password' : 'Password';
      document.getElementById('password').autocomplete = isRecovery || signup ? 'new-password' : 'current-password';
      document.getElementById('password').required = !forgot;
      document.getElementById('confirmGroup').hidden = !(signup || isRecovery);
      document.getElementById('confirmPassword').required = signup || isRecovery;
      document.getElementById('submitButton').textContent = isRecovery ? 'Save new password' : forgot ? 'Send reset link' : signup ? 'Create account' : 'Sign in';
      document.getElementById('socialActions').hidden = forgot || isRecovery;
      document.getElementById('links').hidden = isRecovery;
      document.getElementById('modeButton').textContent = forgot ? 'Back to sign in' : signup ? 'Already have an account? Sign in' : 'Create account';
      document.getElementById('forgotButton').hidden = signup || forgot;
    }
    document.getElementById('modeButton').onclick = () => { mode = mode === 'signup' || mode === 'forgot' ? 'signin' : 'signup'; setStatus(''); showMode(); };
    document.getElementById('forgotButton').onclick = () => { mode = 'forgot'; setStatus(''); showMode(); };
    document.getElementById('googleButton').onclick = async event => {
      event.currentTarget.disabled = true;
      try { await db.signInWithGoogle(callbackUrl()); }
      catch (error) { setStatus(error.message || 'Google sign-in failed.', true); event.currentTarget.disabled = false; }
    };
    document.getElementById('authForm').onsubmit = async event => {
      event.preventDefault();
      const button = document.getElementById('submitButton');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmation = document.getElementById('confirmPassword').value;
      button.disabled = true; setStatus('');
      try {
        if ((mode === 'signup' || mode === 'recovery') && password !== confirmation) throw new Error('Passwords do not match.');
        if (mode === 'signin') { await db.signIn(email, password); location.replace(nextPage); }
        else if (mode === 'signup') {
          const result = await db.signUp(email, password, callbackUrl());
          if (result.authenticated) location.replace(nextPage);
          else { mode = 'signin'; showMode(); setStatus('Account created. Check your email to confirm it, then sign in.'); }
        } else if (mode === 'forgot') {
          await db.sendPasswordReset(email, callbackUrl('recovery'));
          setStatus('If an account exists for that address, a reset link is on its way.');
        } else {
          await db.updatePassword(password);
          location.replace(nextPage);
        }
      } catch (error) { setStatus(error.message || 'Authentication failed. Please try again.', true); }
      finally { button.disabled = false; }
    };
    showMode();
    if (params.has('error_description')) setStatus(params.get('error_description'), true);
    db.init().then(authenticated => {
      if (recovery) {
        if (authenticated) { mode = 'recovery'; showMode(); }
        else { mode = 'forgot'; showMode(); setStatus('This reset link is invalid or expired. Enter your email to request another.', true); }
      } else if (authenticated) location.replace(nextPage);
    }).catch(error => {
      setStatus(error.message || 'Could not connect to Supabase.', true);
      document.getElementById('submitButton').disabled = true;
      document.getElementById('googleButton').disabled = true;
    });
  </script>
</body>
</html>
